<script type="application/json" id="reports">[{"date":"2026-11-21","label":"2026-11-21 非交易日","kind":"nontrading","title":"台股非交易日日報｜2026/11/21（六）～11/22（日）","md":"# 台股非交易日日報｜2026/11/21（六）～11/22（日）\r\n\r\n- **涵蓋期間：** 11/21（六）、11/22（日），到 11/23（週一）有新的交易日日報為止\r\n- **更新內容：** 美股、週末新聞與政策、下一個交易日的觀察重點（沒有新的盤面數據）\r\n- **台股籌碼與槓桿：** 見 [2026-11-20 日報](#2026-11-20)\r\n\r\n**更新時間：2026-11-23 00:10（台北時間）**\r\n\r\n## 一、重點結論\r\n**一句話：** 週末政府已經正式出手（金管會公告 11/23 起全面禁止平盤以下放空，國安基金宣布已進場），但美股週五收盤重挫，台指期夜盤也比結算價低約 5%。\r\n\r\n1. **美股週五收盤重挫，台指期夜盤也比結算價低。**\r\n   - **發生什麼事：** 美股 11/20 收盤（[Yahoo Finance](https://finance.yahoo.com/)）：半導體指數（費半）-10.73%、那斯達克 -5.28%、標普 500 -3.70%、輝達 -14.01%、台積電在美國掛牌的股票（ADR）-9.48%、追蹤台灣股市的美國 ETF（EWT）-10.95%。同一天其他晶片股也大跌：美光 -13.89%、超微（AMD）-13.25%、博通 -12.19%、日月光 ADR -13.84%、聯電 ADR -10.15%（[Stock Titan 全日整理](https://www.stocktitan.net/articles/stock-market-today-live-november-20-2026)）。\r\n   - **台指期夜盤：** 11/21 凌晨收 33,919 點（[期交所行情資訊網站](https://mis.taifex.com.tw/futures/)），比 11/20 的台指期結算價 35,800 點（[期交所](https://openapi.taifex.com.tw/v1/DailyMarketReportFut)）低 1,881 點（-5.25%）。和台股現貨週五收盤 36,033.29 點相比，低約 2,114 點（-5.87%）。夜盤是台灣期貨市場在股市休市時的交易，等於已經有人用真錢預先定價週一的台股。\r\n   - **這代表什麼：** 台積電 ADR 和夜盤都比台灣收盤價低，是週一開盤前市場已經出現的價格訊號。夜盤是期貨市場的交易，不等於台股開盤價；台股單日跌幅上限是 10%。\r\n   - **美股為什麼跌：**\r\n     - **AI 投資能不能賺回來的疑慮：** 市場質疑 AI 基礎建設的大量投資是否能產生足夠報酬（CNBC 報導，經 [Stock Titan](https://www.stocktitan.net/articles/stock-market-today-live-november-20-2026) 轉引）。財政部 11/21 新聞稿也把美股重挫歸因於美國 AI 監管疑慮、資本支出報酬與融資風險（[財政部 11/21 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=722e9b57fd8c44efba51d94b1f7eb6e5)）。\r\n     - **美國通膨偏高，市場擔心利率還會再升：** 聯準會理事庫克 11/20 在智利央行年會的[演講全文](https://www.federalreserve.gov/newsevents/speech/cook20261120a.htm)說，美國 10 月 PCE 通膨估計年增 3.8%（扣除食品與能源的核心為 3.2%）；聯準會 9 月已把利率升到 3.75% 到 4.00%，10 月維持不動時她投了反對票，主張再升 0.25 個百分點。她的原話意思是「再等下去，升息有落後通膨的風險（behind the curve）；一旦落後，之後可能需要更多、更大幅度的升息」。利率越高，一般認為對股價偏高的科技股越不利。\r\n     - **Anthropic 上市後股價回落，** 拖累持有它的亞馬遜與 Alphabet（[24/7 Wall St](https://247wallst.com/investing/2026/11/20/stock-market-today-anthropics-mega-ipo-sends-stocks-lower-for-a-second-day/)）。\r\n\r\n2. **政府週末正式出手：金管會公告五項措施，11/23 週一起生效。**\r\n   - **官方原文（[金管會 11/21 新聞稿](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611210001\u0026dtable=News)）：**\r\n     1. **全面禁止平盤以下放空：** 融券賣出與借券賣出上市（櫃）股票和台灣存託憑證（TDR），賣出價格不得低於前一營業日收盤價。例外：證券商與期貨商因業務避險需求的融券和借券賣出。\r\n     2. **融券保證金成數由 130% 調高到 150%：** 放空要先拿出的保證金變多。\r\n     3. **暫停受理證券商申請發行認售權證上市（櫃）。**\r\n     4. **鼓勵上市（櫃）公司實施庫藏股：** 在 115 年第 4 季到 116 年第 1 季期間屆滿或執行完畢的，可納入 115 年 ESG 評鑑加分。庫藏股就是公司買回自己的股票。\r\n     5. **鼓勵金融機構等出借人暫停對外出借股票，** 已出借的視契約提前召回或到期不再續借。\r\n   - **這三波限空令的差別：** 11/9 第一波先調整盤中借券賣出委託數量與融券保證金成數；11/19 公告、11/20 生效的第二波（[金管會 11/19 新聞稿](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611190001\u0026dtable=News)），只針對「當日收盤跌幅達 3.5% 以上」的個股，次一交易日不得低於前一營業日收盤價放空，並把盤中借券賣出委託數量上限由前 30 營業日日均量的 3% 降到 1%。第三波把「跌幅 3.5%」這個條件拿掉，變成所有上市櫃股票都適用。\r\n   - **會有什麼作用，作用的邊界在哪：** 放空要更貴、更難、不能追著下跌賣，所以空方的推波助瀾會變小。但這波下跌的主要賣壓是持股的人賣出和融資被強制賣出（見[第一節第 3 點](#2026-11-20-s1-p3)）；11/20 的借券賣餘額一個月幾乎沒變，代表放空本來就不是主因。前兩波限空令實施期間，台股仍然一週跌 17.5%，單靠限制放空，並沒有擋住這一週的跌勢。\r\n   - **國安基金（[財政部國庫署 11/21 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=722e9b57fd8c44efba51d94b1f7eb6e5)）：** 標題是「國安基金已進場護盤穩定臺股，請投資人保持信心」。內容：依 11/6 臨時委員會議（[財政部 11/06 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=d76cfbf3f67840568607d7bcbe1d7962)）的授權，已進場展開護盤；沒有公布買進金額，也沒有公布進場日期；並說外資等雖然多日賣超台股，但「已漸趨收斂」，沒有給數字。意思是政府已經在買，但市場看不到買多少，無法判斷力道。\r\n   - **行政院專案會議（11/21 上午，卓榮泰主持；[中央廣播電台 14:10](https://tw.news.yahoo.com/%E5%8F%B0%E8%82%A1%E5%8B%95%E7%9B%AA-%E5%8D%93%E6%A6%AE%E6%B3%B0%E5%8F%AC%E9%96%8B%E5%B0%88%E6%A1%88%E6%9C%83%E8%AD%B0-%E8%A6%81%E6%B1%82%E5%BC%B7%E5%8C%96%E5%9C%8B%E5%AE%89%E5%9F%BA%E9%87%91%E7%A9%A9%E5%AE%9A%E5%B8%82%E5%A0%B4%E5%8A%9B%E9%81%93-061052957.html)、[中時 15:50](https://tw.news.yahoo.com/%E5%8F%B0%E8%82%A1%E5%89%B5%E5%8F%B2%E4%B8%8A%E7%AC%AC3%E5%A4%A7%E8%B7%8C%E9%BB%9E-%E5%8D%93%E6%A6%AE%E6%B3%B0%E9%80%A32%E5%A4%A9%E9%96%8B%E6%9C%83-%E5%9C%8B%E5%AE%89%E5%9F%BA%E9%87%91%E6%88%90%E7%84%A6%E9%BB%9E-075039562.html)）：** 發言人轉述四項裁示：財政部加強企業融資、信用保證與國安基金的支持；金管會提出穩定市場措施；經濟部協助企業；央行密切注意匯率，必要時處置。\r\n\r\n3. **週一（11/23）有已知的強制賣股。** 證交所數字顯示，11/20 有 6,462 戶借錢買股的人，擔保品不夠，要補的錢共 64.64 億；其中沒補錢的，預計下一個交易日有 632 戶、約 14.95 億會被券商直接賣掉股票。強制賣出會再壓低股價（詳見 [11/20 日報的 4.1](#2026-11-20-s4-1)）。這一塊金管會五項措施沒有處理，官方也沒有公告「國安基金規模倍增」（需要立法院修法）。11/22 有媒體報導證交所研議把整戶維持率門檻由 130% 降到 120%，尚未公告（見[第三節 3.1](#2026-11-21-s3-1)）。\r\n\r\n4. **輝達股價在近一年多的低點，財報之外還有幾件事沒有解決。**\r\n   - **事實：** 11/20 收盤 125.53 美元，單日 -14.01%，從 11/18 的 150.96 美元算起兩天累計約 -17%（[Yahoo Finance](https://finance.yahoo.com/quote/NVDA/history/)）；11/17 公布的財報營收 1,158.4 億美元，年增 103%，資料中心營收 1,076 億美元，下一季營收預估 1,300 億美元（±3%）（[輝達新聞稿](https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-third-quarter-fiscal-2027)）。\r\n   - **還沒解決的事：**\r\n     - **執行長位置空著：** 黃仁勳 11/12 辭職，財務長 Kress 暫代（[SEC 公告](https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm)）。\r\n     - **12/1 國會訪談：** 眾議院中國特別委員會公布，黃仁勳 12/1、輝達法務長 12/2 同意接受有逐字記錄的閉門訪談（[眾議院中國特別委員會 11/17 新聞稿](https://chinaselectcommittee.house.gov/media/press-releases/jensen-huang-and-nvidia-agree-to-appear-before-congress)）。\r\n     - **美國證管會（SEC）調查：** 《華爾街日報》11/17 引述知情人士報導，SEC 展開民事調查，部分審查輝達的資訊揭露是否誤導投資人；SEC 與輝達都沒有證實（[InvestmentNews](https://www.investmentnews.com/equities/embattled-nvidia-faces-sec-probe-as-california-attorney-general-mulls-action/269054)、[世界日報](https://www.worldjournal.com/wj/story/121172/9886355)）。\r\n     - **加州檢察長 Bonta** 11/17 在彭博電視說，辦公室在檢視輝達晶片是否轉運到中國，沒有給細節，報導裡也沒有提到傳票（InvestmentNews）。\r\n     - **美國財政部長貝森特**說，需要董事會和外部律師在 10 天內給答案（[InvestmentNews 11/17](https://www.investmentnews.com/equities/embattled-nvidia-faces-sec-probe-as-california-attorney-general-mulls-action/269054)）。\r\n     - **對中國出貨：** 輝達財測不含中國資料中心運算營收（[輝達新聞稿](https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-third-quarter-fiscal-2027)）；上一季（到 10/25）Hopper 系列資料中心產品對中國出貨 24 億美元（[輝達 CFO 評論](https://www.sec.gov/Archives/edgar/data/1045810/000104581026000088/q3fy27cfocommentary.htm)）。Kress 在 11/17 財報電話會議說，已停止出貨經許可的 Hopper 系列產品（包括 H200）到中國（[TweakTown](https://www.tweaktown.com/news/114771/nvidia-stops-shipping-licensed-hopper-ai-chips-including-h200-to-china/index.html)、[Digital Today](https://www.digitaltoday.co.kr/en/view/127494/nvidia-to-halt-h200-sales-to-china-after-jensen-huang-exit)；輝達官方財報文件沒有這句話）。\r\n   - **為什麼影響台股：** 輝達是台灣 AI 供應鏈的最大客戶之一，它的股價走弱，通常連帶影響台積電等台股電子股。\r\n\r\n5. **台幣離 33 約 0.2%，央行已被要求密切注意。** 美元兌台幣 11/20 為 32.936，前一日 32.942（[期交所每日外幣參考匯率](https://openapi.taifex.com.tw/v1/DailyForeignExchangeRates)）。外資如果大量賣股、把錢匯出去，台幣會貶值；行政院四項裁示中，央行被要求密切注意匯率並採取必要處置。\r\n\r\n## 二、美股與外部環境（11/20 收盤，台北 11/21 早上抓取）\r\n資料來源：[Yahoo Finance](https://finance.yahoo.com/) 日線（沒有找到可取得的官方資料；只列主要數字）；美元兌台幣為[期交所每日外幣參考匯率](https://openapi.taifex.com.tw/v1/DailyForeignExchangeRates)。「11/19 收盤」到「11/20 收盤」的變動。\r\n\r\n| 項目 | 11/19 收盤 | 11/20 收盤 | 變動 |\r\n|---|---:|---:|---:|\r\n| 標普 500 | 7,175.83 | 6,910.39 | -3.70% |\r\n| 那斯達克綜合 | 23,879.20 | 22,617.73 | -5.28% |\r\n| 費城半導體 | 9,419.72 | 8,408.59 | -10.73% |\r\n| 美國 VIX | 28.44 | 35.89 | +7.45 點 |\r\n| 輝達 NVDA | 145.98 | 125.53 | -14.01% |\r\n| 台積電 ADR（TSM） | 352.09 | 318.71 | -9.48% |\r\n| iShares 台灣 ETF（EWT） | 83.96 | 74.77 | -10.95% |\r\n| 美元兌台幣 | 32.942 | 32.936 | -0.02% |\r\n\r\n**這些數字怎麼看：**\r\n- **跌的是科技與半導體，但已經擴散到整個美股。** 費半 -10.73% 是最重的；標普 500 比 10/6 的歷史高點低約 11.5%，已進入「修正」（從高點跌 10% 以上）；[Stock Titan](https://www.stocktitan.net/articles/stock-market-today-live-november-20-2026) 寫，道瓊 ETF（DIA）一週跌約 8.0%，是 2020 年 3 月以來最大的單週跌幅。\r\n- **亞洲其他市場也跌，但台灣最重：** 台灣 ETF（EWT）-10.95%、南韓 ETF（EWY）-8.42%、日本 ETF（EWJ）-4.11%。\r\n- **美國 VIX 35.89：** 換算約是市場預期美股接下來一個月平均每天上下震盪約 2.3%（35.89 除以 √252），一天跳升 7.45 點。台灣 VIX 52.20（約 3.3%）與它在不同市場，水位不能直接比較。\r\n- **Anthropic：** 11/19 在那斯達克上市，發行價 83.00 美元，首筆成交 111.50 美元，當天收盤 97.17 美元，比發行價高 17%（這個「+17%」是對發行價，不是當日漲幅）；11/20 收盤 88.91 美元，單日 -8.50%，仍比發行價高約 7.1%（[Stock Titan](https://www.stocktitan.net/articles/stock-market-today-live-november-20-2026)、[商業周刊](https://www.businessweekly.com.tw/international/blog/3023617)）。\r\n\r\n## 三、週末新聞與政策進展\r\n### 3.1 護盤措施：金管會五項已公告、國安基金已進場，其餘仍待公告\r\n- **已公告，11/23 週一起適用：** 金管會五項措施，內容見[第一節第 2 點](#2026-11-21-s1-p2)。\r\n- **還沒有公告（截至 11/22 晚間，[金管會新聞稿列表](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2)最新一則仍是 11/21）：**\r\n  - **「整戶融資擔保維持率由 130% 降到 120%」：媒體報導研議中，證交所與金管會尚未公告。**\r\n    - **背景：** [聯合報 11/20](https://udn.com/news/story/7251/9891975) 引述知情人士報導，行政院討論的選項包括放寬融資擔保維持率的計算；金管會 11/21 的五項措施沒有包含。\r\n    - **11/22 報導（時間為各報導標示）：**\r\n      - **[TVBS 14:17](https://news.tvbs.com.tw/money/4054347)：** 「市場傳出」證交所緊急通知十大券商開會，討論是否由 130% 降到 120%；寫「證交所尚無回應」。\r\n      - **[經濟日報 15:27](https://money.udn.com/money/story/5607/9894620)：** 證交所 22 日上午邀集 10 家大型券商研商，規畫由 130% 調為 120%；須經金管會確認後，再決定上路時間。\r\n      - **[今日新聞 17:03](https://tw.news.yahoo.com/%E8%AD%89%E4%BA%A4%E6%89%80%E6%89%BE%E5%88%B8%E5%95%86-%E5%96%9D%E5%92%96%E5%95%A1-%E8%AB%87%E9%99%8D%E8%9E%8D%E6%93%94%E7%B6%AD%E6%8C%81%E7%8E%87%E9%99%8D-090312898.html)、[今周刊 17:27](https://www.businesstoday.com.tw/article/category/183008/post/202611220008/)：** 寫「朝降到 120% 的方向取得共識」，目標或可望 11/23 上路。\r\n    - **11/23 00:10 查證：** 截至目前，搜尋不到證交所或金管會的正式公告；[風傳媒](https://www.storm.mg/article/11183966)等媒體標題仍寫「傳」「最快明天上路」。\r\n    - **目前能確定與不能確定的：**\r\n      - **官方公告：** 各報導都沒有引用證交所或金管會的正式公告；證交所法規仍以 130% 為追繳門檻。\r\n      - **說法不一致：** 共識程度（「規畫」「取得共識」「討論是否」）、是否 11/23 上路（TVBS 寫「最快本周」）。\r\n      - **對強制處分的影響：** 報導都沒有估算；上面的 6,462 戶、632 戶是以 130% 計算的 11/20 官方數字。\r\n      - **業界表態：** 券商公會理事長陳俊宏公開表示支持調降，認為可減輕追繳壓力，但券商承擔的授信風險變高（經濟日報）。\r\n  - **「國安基金規模倍增到 1 兆元」：** 需立法院修法，目前沒有看到修法進度（[三立 11/20](https://www.setn.com/news/1942451)）。現行 5,000 億是向金融機構借款最多 2,000 億（以國庫持股擔保）加向四大基金借款最多 3,000 億，實務上只用過金融機構借款的 2,000 億；國安基金報告建議把金融機構借款上限提高到 7,000 億、四大基金借款維持 3,000 億，財政部長莊翠雲表示持正面看法（[自由時報 11/11](https://ec.ltn.com.tw/article/breakingnews/5636788)）。\r\n- **官股買超（八大行庫）：** [中國時報 11/19](https://wantrich.chinatimes.com/news/20261119900297-420101) 報導，八大行庫當日買超 329.84 億元、四日合計約 766.63 億元（官股買賣超沒有官方資料）。\r\n\r\n### 3.2 輝達與 AI 供應鏈\r\n- **事實與調查：** 詳見[第一節第 4 點](#2026-11-21-s1-p4)。\r\n- **後續時程：** 12/1 黃仁勳、12/2 輝達法務長接受眾議院委員會的閉門訪談（[眾議院中國特別委員會 11/17 新聞稿](https://chinaselectcommittee.house.gov/media/press-releases/jensen-huang-and-nvidia-agree-to-appear-before-congress)）。完整事件脈絡請看 [11/20 日報的 8.6](#2026-11-20-s8-6)。\r\n\r\n## 四、台股既有風險（沿用 11/20 日報，未更新）\r\n- **強制賣股：** 官方整戶擔保維持率 151.78%，低於 130% 的戶數 6,462 戶，預計 11/23 強制處分 632 戶、14.95 億。（機制見 [11/20 日報 4.1](#2026-11-20-s4-1)。）\r\n- **借錢買股的規模：** 融資餘額 4,352 億，單日少 491 億，是證交所儀表板資料（2026-08-24 起）中最大的單日減少。\r\n- **跌勢擴散程度：** 創一年新低的股票 488 檔（約一半）；台灣 VIX 52.20，表示選擇權市場預期每天約震盪 3.3%。\r\n- **時間尺度：** 一週累計 -7,641.83 點（-17.5%），是證交所 2024 年 1 月以來資料中最大的單週跌幅（[證交所](https://www.twse.com.tw/rwd/zh/TAIEX/MI_5MINS_HIST?date=20261101\u0026response=json)）。\r\n\r\n## 五、下一個交易日（11/23 週一）已知事項與觀察\r\n| 觀察項目 | 為什麼看 |\r\n|---|---|\r\n| 週一開盤價與週五收盤價的差距（對照夜盤收 33,919、台積電 ADR -9.48%） | 夜盤與 ADR 都比台灣收盤價低；開盤實際差距，反映市場有沒有已經提前反映這些消息 |\r\n| 全面禁止平盤以下放空生效後，融券與借券賣出是否明顯減少 | 觀察金管會措施有沒有真的壓住空方；證交所每日有融券借券賣出統計 |\r\n| 國安基金實際買進的力道（成交量、權值股走勢） | 官方沒有公布金額，只能從盤面推估 |\r\n| 官方整戶維持率、追繳與處分戶數是否擴大；預計處分是否如期進行 | 判斷強制賣出的連鎖循環是在加速還是減速；金管會措施沒有處理這一塊。另看證交所是否正式公告把門檻由 130% 降到 120%（目前只有媒體報導），公告後追繳戶數的計算基準會跟著變 |\r\n| 外資動向：外資現貨由賣轉買、期貨空單回補 | 外資是否停止賣出，是市場常用來判斷賣壓是否減輕的指標之一 |\r\n| 成交量 | 量縮的下跌可能是沒人敢買；爆大量後價格不再創新低，才較像有人承接 |\r\n| 台幣是否貶破 33，以及央行有沒有動作 | 外資若大量賣股匯出，台幣會急貶，是賣壓加速的訊號；央行已被要求密切注意 |\r\n| 輝達後續：接班人、12/1 國會訪談、SEC 調查、財政部長要求的 10 天答覆 | 這些是輝達與 AI 題材相關消息的主要來源 |\r\n\r\n## 六、資料來源與限制\r\n- **官方資料：** [金管會 11/19 新聞稿](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611190001\u0026dtable=News)、[金管會 11/21 新聞稿](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611210001\u0026dtable=News)；[財政部 11/06 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=d76cfbf3f67840568607d7bcbe1d7962)、[財政部 11/21 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=722e9b57fd8c44efba51d94b1f7eb6e5)；[聯準會理事庫克 11/20 演講](https://www.federalreserve.gov/newsevents/speech/cook20261120a.htm)；輝達[SEC 公告（11/12）](https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm)、[財報新聞稿](https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-third-quarter-fiscal-2027)、[CFO 評論](https://www.sec.gov/Archives/edgar/data/1045810/000104581026000088/q3fy27cfocommentary.htm)；[眾議院中國特別委員會 11/17 新聞稿](https://chinaselectcommittee.house.gov/media/press-releases/jensen-huang-and-nvidia-agree-to-appear-before-congress)；期交所[每日行情開放資料](https://openapi.taifex.com.tw/v1/DailyMarketReportFut)、[行情資訊網站（夜盤即時行情）](https://mis.taifex.com.tw/futures/)、[每日外幣參考匯率](https://openapi.taifex.com.tw/v1/DailyForeignExchangeRates)；[證交所臺股儀表板](https://www.twse.com.tw/dashboard/zh/index.html)。\r\n- 限制：所有「最新」數字都是抓取當下的快照。資料由 AI 協助整理，作者已查核。資料來源已列於各項連結；內容為資料彙整與歷史型態解讀，不含對未來走勢的預測，不構成投資建議，無任何金融商品買賣建議，投資人應自行判斷與承擔風險。\r\n"},{"date":"2026-11-20","label":"2026-11-20","kind":"trading","title":"台股大盤日報｜2026-11-20（五）","md":"# 台股大盤日報｜2026-11-20（五）\n\n資料截止：2026-11-20 台股收盤；美股數字為 11/20 美股收盤（台北時間 11/21 早上），見[第七節](#2026-11-20-s7)與 [11/21 非交易日日報第二節](#2026-11-21-s2)。\n\n**閱讀順序：** 一、重點結論 → 二、怎麼解讀，接下來看什麼 → 三到七、支持的數據（每日資料、槓桿籌碼、期貨選擇權情緒、廣度、外部環境）→ 八、新聞與事件 → 九、來源與限制。\n\n## 一、重點結論\n**一句話：** 台股這一週跌了約 17.5%。賣壓有兩個來源：一是大家擔心 AI 熱潮撐不住，賣出跟 AI 有關的大型股；二是借錢買股的人因為股價下跌被迫賣股，賣壓又讓股價更低。第二個來源的數字還在擴大。\n\n1. **跌得又急又廣。** 週五加權指數一天跌 6.23%，收 36,033，比 11/11 的最高點 44,257 少了 18.6%。上市股票只有 16 檔上漲、1,058 檔下跌，179 檔跌停；有 488 檔（約一半）跌到一年來的新低，是近 50 個交易日最多。\n\n2. **借錢買股票（融資）的人，是這波下跌的放大器。**\n   - **融資是什麼：** 向券商借錢買股票，買進的股票押在券商那裡當擔保。\n   - **為什麼會讓下跌更嚴重：** 股價跌，擔保品就變少。「擔保品價值 ÷ 借款金額」（整戶擔保維持率）低於 130%，券商會通知補錢；沒補的話，券商會在下一個交易日直接把股票賣掉。強制賣出會再壓低股價，股價再跌又讓更多人擔保不足，變成「越跌越被迫賣、越賣越跌」。\n   - **現在走到哪一步：** 整戶維持率從 11/13 的 177.48% 降到 11/20 的 151.78%。被通知補錢的帳戶，11/18 是 719 戶，11/20 是 6,462 戶（兩天變成約 9 倍，要補 64.64 億）。預計 11/23（週一）會有 632 戶、約 14.95 億被強制賣出。融資餘額一週少了約兩成（5,412 億降到 4,352 億），週五單日少 491 億，是證交所儀表板資料（2026-08-24 起）中最大的單日減少（[證交所](https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN_TREND?response=json\u0026days=60\u0026date=20261120)）。\n   - **目前有多嚴重：** 預計強制賣出的 14.95 億，只占融資餘額 4,352 億的約 0.34%，所以多數融資減少是投資人自己賣掉，還不是大規模被迫賣出。要擔心的是速度：補錢的帳戶數在兩天內暴增，如果股價繼續跌，這個循環會變快。\n\n3. **賣壓主要來自「持股的人在賣」，不是有人在大舉放空。** 放空是借股票來賣、賭股價下跌。借券賣出成交值只占全市場成交值約 1.1% 到 1.9%（11/20 降到 0.27%），借券賣出餘額 11/10 到 11/20 只增加約 0.45%（[證交所](https://www.twse.com.tw/rwd/zh/IIH/market/lending?start=20261105\u0026end=20261120\u0026response=json)）；外資在期貨上的空單也沒有增加（[期交所](https://www.taifex.com.tw/cht/3/futContractsDate)）。\n\n4. **外資賣得變少。** 外資賣超 11/18 到 11/20 依序是 766、243、95 億，一天比一天少（[證交所](https://www.twse.com.tw/rwd/zh/fund/BFI82U?dayDate=20261120\u0026type=day\u0026response=json)）。\n\n5. **選擇權價格顯示：市場預期接下來每天都會大幅震盪。**\n   - 選擇權可以想成股價的保險：預期波動越大，保險費越貴。台灣 VIX 就是用選擇權價格算出來的「預期波動」指標。\n   - 11/20 是 52.20，大約代表市場預期接下來一個月加權指數平均每天會上下震盪約 3.3%；11/11 的 38.34 則約 2.4%。這是這波下跌以來最高。\n   - **它只說明震盪會多大，不說明會漲還是會跌。**\n\n6. **強制賣出與外部因素仍在變動。** 週五成交量比前幾天少，可能是大家不敢進場接。自營商週五賣了約 290 億的避險部位，這是被動賣出，指數穩住時他們會回補，還沒穩住時也可能讓波動更大。美股 11/20 收盤費半（半導體指數）-10.73%（見[第七節](#2026-11-20-s7)），是下一個交易日開盤前已經出現的價格訊號。\n\n7. **為什麼會跌：已確認的事實，與因果整理。**\n   - **已確認的事實：**\n     - 11/02 到 11/06 加權指數累計跌 5,510 點，11/06 收 39,701，比年內高點 49,968 低 10,267 點（20.55%）；外資累計賣超 5,244 億元，10 月賣超 9,943.16 億元是單月紀錄；國安基金 11/06 14:30 召開臨時委員會議，決定啟動安定市場任務（[財政部 11/06 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=d76cfbf3f67840568607d7bcbe1d7962)）。\n     - 輝達（AI 晶片龍頭）執行長黃仁勳 11/12 辭職（[SEC 公告](https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm)）。輝達股價 11/12 收 166.19 美元，比前一日的 173.73 美元低 4.3%（[Yahoo Finance](https://finance.yahoo.com/quote/NVDA/history/)）。\n     - 美股費半 11/13 跌 3.43%（[Yahoo Finance](https://finance.yahoo.com/quote/%5ESOX/history/)），台股 11/16 跌 6.03%，電子工業類指數跌 6.72%（[證交所](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261116\u0026type=IND\u0026response=json)）。\n     - 輝達 11/17 公布財報：營收 1,158.4 億美元，年增 103%；資料中心營收 1,076 億美元；下一季營收預估 1,300 億美元（±3%）（[輝達新聞稿](https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-third-quarter-fiscal-2027)）。股價之後仍然下跌：11/19 跌 3.3%，11/20 跌 14.01%（Yahoo Finance）。\n     - 市場說法：[經濟日報 11/09](https://money.udn.com/money/amp/story/5607/9865999) 報導，美國期中選舉後有政治人物主張暫停蓋 AI 資料中心，市場擔心 AI 基礎建設放緩。財政部 11/21 新聞稿也把美股重挫歸因於美國 AI 監管疑慮、資本支出報酬與融資風險（[財政部 11/21 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=722e9b57fd8c44efba51d94b1f7eb6e5)）。\n   - **因果整理（推論，不是官方結論）：**\n     1. 起點是市場開始懷疑「AI 投資會不會放緩、花的錢賺不賺得回來」。AI 晶片的需求，是台積電等台灣電子大型股的主要成長故事，這個故事被質疑，這些股票就被賣出。\n     2. 輝達執行長辭職加深不安：領導層不穩、對中國出貨有不確定性。輝達與台積電在美國的股票下跌，帶動台股電子股。\n     3. 輝達財報營收年增 103% 仍然下跌，表示市場擔心的不是它這一季賺得多不多，而是整個 AI 題材的長期風險。\n     4. 台股自己的放大器：融資水位高，股價急跌後引發強制賣出，加上自營商避險賣出，讓跌幅比消息本身更大。\n   - **沒有定論的地方：** 沒有官方資料指出單一原因。例如輝達辭職後台股第一個交易日（11/13）反而上漲 1.35%，所以辭職不是主因。詳細時間線見 [8.6](#2026-11-20-s8-6)。\n## 二、怎麼解讀，接下來看什麼\n**近期出現的指標變化：**\n- 外資賣超一天比一天少。\n- 成交量最後兩天縮小。\n- 融資已經少了約兩成。\n- 台灣 VIX 和創新低家數都升到近期最高。\n\n**需要留意的地方：**\n- **強制賣股的數字還在增加。** 融資的安全墊（整戶維持率）連續下降，一週少了約 25 個百分點，被通知補錢的帳戶一天內從 719 戶變成 6,462 戶，11/23 預計有 632 戶、14.95 億被強制賣出。不過這個金額相對於 4,352 億的融資餘額不大，代表融資減少的大部分是自己選擇賣出，不是被強制賣出；證交所董事長 11/20 也說違約交割和追繳處分「尚未出現明顯異常」（[經濟日報 11/20](https://udn.com/news/story/7251/9892045)）。這些數字目前還在加速。\n- **量縮的下跌，不代表賣壓用完了**，也可能只是沒人敢買。要看到「爆出大量之後，價格不再創新低」才比較有說服力。\n- **自營商避險賣出是被動的**：指數穩住時他們會買回來；還沒穩住時也會讓下跌更快。\n- **美股 11/20 收盤大跌**（費半 -10.73%），美國 VIX 收 35.89；隔夜美股是下一個交易日開盤前的參考之一。\n- **台灣 VIX 很高，但 Put/Call 比沒有升高，兩個指標看的東西不同。** VIX 看的是「保險費貴不貴」（預期波動大小）；Put/Call 比看的是買「看跌保險」和「看漲保險」的口數比例。保險費變貴，不一定代表買看跌保險的人變多。Put/Call 比也可能受 11/18 結算影響，原因無法確認。\n**接下來要看（每項都說明為什麼看）：**\n1. **美股 11/20 已收盤（費半 -10.73%）：** 是下一個交易日開盤前的參考價格，也是外資買賣時會參考的外部資訊之一。\n2. **整戶維持率有沒有回升，追繳與處分戶數有沒有減少：** 這是在看強制賣出的連鎖循環是在加速還是減速；11/23 預計處分的戶數與金額是否變大，是第一個檢驗。\n3. **外資有沒有由賣轉買、外資期貨空單有沒有回補：** 外資是否停止賣出，是市場常用來判斷賣壓是否減輕的指標之一。\n4. **有沒有出現「爆大量後價格不再創新低」，上漲家數有沒有回到幾百檔、創新低家數有沒有下降：** 這是有人願意在低檔承接的證據。\n5. **台幣有沒有貶破 33，同時外資賣超有沒有擴大：** 兩者同時出現，代表資金在加速匯出。\n6. **政策：金管會 11/21 已公告第三波限空令（11/23 起生效，內容見 [11/21 非交易日日報](#2026-11-21-s1-p2)）；放寬融資維持率與擴大國安基金規模尚未公告（見 [8.3](#2026-11-20-s8-3)）：** 限空令針對放空，管不到強制賣出，後兩項才直接針對強制賣出與政府買盤。\n7. **輝達事件後續（見 [8.6](#2026-11-20-s8-6) 的追蹤清單）：** 接班人、12/1 國會訪談與對中國出口政策，是 AI 題材相關消息的主要來源。\n## 三、每日資料（11/10 到 11/20）\n**表 A：指數、廣度與波動**\n| 日期 | 加權指數 | 漲跌% | 上漲／下跌¹ | 漲停／跌停¹ | 成交值(億)² | 創新低家數³ | 台灣 VIX |\n|---|---|---|---|---|---|---|---|\n| 11/10 | 42,711.92 | +2.52 | 526／491 | 30／2 | 9,322 | 33 | 40.06 |\n| 11/11 | 44,257.15 | +3.62 | 634／368 | 34／3 | 7,912 | 29 | 38.34 |\n| 11/12 | 43,091.87 | -2.63 | 277／730 | 12／10 | 9,592 | 19 | 40.28 |\n| 11/13 | 43,675.12 | +1.35 | 811／199 | 28／3 | 8,560 | 21 | 37.84 |\n| 11/16 | 41,040.08 | -6.03 | 99／948 | 8／83 | 7,495 | 72 | 48.72 |\n| 11/17 | 40,092.11 | -2.31 | 234／789 | 6／30 | 8,673 | 134 | 49.54 |\n| 11/18 | 40,194.91 | +0.26 | 492／520 | 21／4 | 9,585 | 126 | 45.86 |\n| 11/19 | 38,426.89 | -4.40 | 67／993 | 1／128 | 7,893 | 248 | 49.27 |\n| 11/20 | 36,033.29 | -6.23 | 16／1,058 | 4／179 | 7,225 | 488 | 52.20 |\n\n**表 B：槓桿與資金籌碼**\n| 日期 | 融資餘額(億) | 融資增減(億) | 官方整戶維持率% | 低於 130% 戶數⁴ | 外資現貨(億) | 三大法人合計(億) | 外資台指期淨OI(口) | 現股當沖比% |\n|---|---|---|---|---|---|---|---|---|\n| 11/10 | 5,366.8 | -32.4 | 173.95 | 250 | -341.2 | -117.6 | -103,473 | 28.89 |\n| 11/11 | 5,411.6 | +44.8 | 179.76 | 193 | -7.7 | +240.8 | -104,271 | 25.42 |\n| 11/12 | 5,334.8 | -76.8 | 173.99 | 238 | -6.8 | +53.4 | -99,573 | 29.33 |\n| 11/13 | 5,366.0 | +31.2 | 177.48 | 209 | +288.4 | +452.7 | -100,870 | 31.30 |\n| 11/16 | 5,245.0 | -121.0 | 165.98 | 733 | -701.9 | -1,143.9 | -96,787 | 23.91 |\n| 11/17 | 5,087.2 | -157.8 | 161.25 | 1,118 | -380.9 | -576.1 | -97,896 | 30.78 |\n| 11/18 | 5,080.3 | -7.0 | 163.16 | 719 | -765.6 | -641.5 | -99,438 | 33.08 |\n| 11/19 | 4,843.7 | -236.6 | 156.18 | 2,947 | -243.1 | -432.3 | -99,219 | 27.83 |\n| 11/20 | 4,352.3 | -491.4 | **151.78** | **6,462** | -95.1 | -509.4 | -97,863 | 26.10 |\n\n¹ 股票欄（上市，不含權證、ETF 等）；新聞常用「上市＋櫃買」口徑，數字不同。\n² 證交所一般股票成交值；『大盤統計資訊』11/20 的『證券合計』為 7,234.15 億，『總計』（含 ETF、權證等）為 9,353.10 億（[證交所](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261120\u0026type=MS\u0026response=json)）。\n³ 自行計算，標準見[第六節](#2026-11-20-s6)。\n⁴ 證交所儀表板稱「追繳戶數」，定義見[第四節](#2026-11-20-s4)。\n\n\n**累計：**\n- 指數：11/11 的 44,257 到 11/20 的 36,033，-18.6%；11/13 到 11/20，-17.5%。\n- 近 5 日（11/16 到 11/20）三大法人合計賣超約 3,303 億，其中外資約 2,187 億。\n- 融資餘額：-1,060 億（-19.6%）。官方整戶維持率：11/13 的 177.48% 到 11/20 的 151.78%。\n\n## 四、槓桿與籌碼\n### 4.1 融資融券與官方整戶擔保維持率\n- 融資 8,398,744 張（前日 8,947,612 張）、融券 199,791 張，券資比 2.38。\n- **官方整戶維持率來源：** [證交所臺股儀表板](https://www.twse.com.tw/dashboard/zh/index.html)（2026-09-23 上線，「信用交易」→「融資融券」頁）。\n\n| 日期 | 整戶維持率% | 低於 130% 戶數（儀表板稱「追繳戶數」） | 追繳金額(億) | 預計次日處分戶數¹ | 預計次日處分金額(億)¹ |\n|---|---:|---:|---:|---:|---:|\n| 11/09 | 168.44 | 1,197 | 0.15 | 81 | 0.61 |\n| 11/10 | 173.95 | 250 | 0.13 | 16 | 0.34 |\n| 11/11 | 179.76 | 193 | 0.10 | 20 | 0.06 |\n| 11/12 | 173.99 | 238 | 0.89 | 56 | 0.30 |\n| 11/13 | 177.48 | 209 | 0.07 | 27 | 0.17 |\n| 11/16 | 165.98 | 733 | 3.97 | 247 | 5.67 |\n| 11/17 | 161.25 | 1,118 | 6.51 | 207 | 6.88 |\n| 11/18 | 163.16 | 719 | 1.07 | 72 | 2.20 |\n| 11/19 | 156.18 | 2,947 | 29.64 | 520 | 9.18 |\n| 11/20 | **151.78** | **6,462** | **64.64** | **632** | **14.95** |\n\n¹ 儀表板定義：處分戶數與金額是「未依期限補足差額或屆期未清償，次一營業日應由證券商處分信用交易部位」的戶數與金額，也就是下一個交易日預期的強制處分（11/20 的對應日是 11/23，週一），不是當日已發生的賣出。追繳金額是「當日證券商通知應補繳之金額」。11/20 另有 82,967 戶有信用交易（占總開戶數約 0.31%）；券商不限用途款項借貸的維持率為 220.72%。\n\n- **解讀（機制、現在到哪一步、嚴重程度）：** 擔保品不夠（維持率低於 130%）的帳戶，會被券商通知補錢；沒補，下一個交易日就被強制賣股，這個賣出又會壓低股價（機制見[第一節第 2 點](#2026-11-20-s1-p2)）。現在走到：低於 130% 的戶數兩天內從 719 戶增到 6,462 戶，追繳金額 11/20 單日 64.64 億，是這段時間最高。嚴重程度：追繳金額約占融資餘額 4,352 億的 1.5%、預計處分約 0.34%，金額還小，所以不是大規模被迫賣出；但戶數與金額都在翻倍增加，風險在速度。130% 是**追繳**線，不是立刻被賣的線。\n### 4.2 借券與當沖\n- **借券賣出（法人放空的主要方式）：** 借券賣出是向別人借股票來賣、賭股價下跌。證交所儀表板的借券賣出成交值，11/10 到 11/19 每天約 112 到 176 億元，占全市場成交值 1.1% 到 1.9%；11/20 降到 25.62 億元（0.27%）（[證交所](https://www.twse.com.tw/rwd/zh/marginTrading/TWIEIU_TREND?response=json\u0026days=12\u0026date=20261120)），因為第二波限空令把盤中借券賣出委託數量上限降到 1%。借券賣出餘額從 11/10 的 18,409,097 張到 11/20 的 18,492,035 張，只增加 82,938 張（約 0.45%）；近 5 日增減：+9,494（11/16）、-55,009、+54,625、+65,637、+11,002（[證交所](https://www.twse.com.tw/rwd/zh/IIH/market/lending?start=20261105\u0026end=20261120\u0026response=json)）。意思是：下跌期間沒有出現大規模新增的放空，賣壓主要來自持股的人。\n- **當沖（當天買進又當天賣出）：** 當沖比是當沖成交股數占總成交股數的比例，大家搶短線時會升高。11/20 是 26.1%（4,460,672 張），比 11/18 的 33.08% 低（[證交所](https://www.twse.com.tw/rwd/zh/dayTrading/TWTB4U?date=20261120\u0026response=json)），代表這波下跌不是短線客搶進搶出推動的。\n### 4.3 三大法人與官股（11/20）\n- 三大法人現貨（[證交所 BFI82U](https://www.twse.com.tw/rwd/zh/fund/BFI82U?dayDate=20261120\u0026type=day\u0026response=json)，億）：外資 -95.1、投信 -73.5、自營商自行買賣 -50.7、自營商避險 -290.2，合計 -509.4。（新聞報導的數字略有不同，見 [8.7](#2026-11-20-s8-7)。）\n- 官股（八大行庫）：[中國時報 11/19](https://wantrich.chinatimes.com/news/20261119900297-420101) 報導八大行庫 11/19 買超 329.84 億元、四日合計約 766.63 億元（官股買賣超沒有官方資料）。\n\n## 五、期貨、選擇權與情緒\n- **外資台指期淨未平倉 -97,863 口（11/20，比前一天少 1,356 口空單；[期交所](https://www.taifex.com.tw/cht/3/futContractsDate)）。** 白話：外資在台指期貨上持有的空單比多單多約 9.8 萬口，近 10 天都在 -96,787 到 -104,271 口之間。這代表兩件事：外資沒有趁大跌再加碼做空，但也沒有大舉回補，還沒有轉為樂觀。（外資常用期貨對沖現貨持股，所以空單多不一定是看空；這裡只含臺股期貨 TXF。）\n- **投信台指期淨未平倉 +87,599 口。** 投信（國內基金公司）在期貨上持有淨多單約 8.8 萬口，與外資方向相反；目前沒有資料說明原因，這裡只記錄。\n- **台灣 VIX 52.20（11/20，比前一天 +2.93；[期交所](https://www.taifex.com.tw/file/taifex/Dailydownload/vix/log2data/202611new.txt)）。** 台灣 VIX 是用選擇權價格算出來的「預期波動」指標。選擇權是用真錢買保險，預期波動越大，保險費越貴。52.20 大約代表市場預期接下來一個月加權指數平均每天上下震盪約 3.3%。近 8 日：38.34（11/11，約 2.4%）、40.28、37.84、48.72（11/16）、49.54、45.86、49.27、52.20，一週內升約 36%，是這波急殺期間最高。**它只說明震盪會多大，不說明漲跌方向。**\n- **選擇權 Put/Call 比（[期交所](https://openapi.taifex.com.tw/v1/PutCallRatio)晚一天公布，最新為 11/19）。** Put 是看跌選擇權（用來防跌或賭跌），Call 是看漲選擇權；比值是看跌的成交量 ÷ 看漲的成交量。成交量比 73.38%，表示看跌的成交量比看漲少。未平倉比 41.00%，表示還沒了結的看跌部位只有看漲的 41%。近 5 日成交量比 98.66、81.01、78.95、91.97、73.38；未平倉比 57.75、53.79、54.08、39.80、41.00。一般來說，買保險的人變多時這個比值會升高；現在沒有升高，和 VIX 大幅上升不一致，原因無法確認，可能受 11/18 結算影響，或避險是用期貨、現貨進行。\n## 六、廣度與創新高低\n- **創新高／創新低家數（用[證交所每日收盤行情](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261120\u0026type=ALLBUT0999\u0026response=json)自行計算）：** 指當天股價創下過去 250 個交易日（約一年）新高或新低的股票數。11/20 創新高 3 檔（0.3%）、創新低 488 檔（47.9%）。**意思是：約一半的股票已經跌到一年來的最低價，跌勢擴散到大多數股票，不只是少數權值股被賣。** 這是 2026-09-07 以來（共 50 個交易日）的最高值，前一高是 11/06 的 369 檔（36.3%）。近 9 日創新低家數：19（11/12）、21、72（11/16）、134、126、248、488；創新高家數都在個位數到十幾檔。計算方式：用證交所每日收盤行情自行計算，用盤中高低價對照前 250 個交易日，約 1,018 檔 4 位數一般股票，不含 ETF，未調整除權息。\n- **較長期的漲跌家數對照（上市股票，[證交所大盤統計資訊](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261106\u0026type=MS\u0026response=json)）：**\n\n| 日期 | 漲停 | 上漲 | 跌停 | 下跌 |\n|---|---:|---:|---:|---:|\n| 11/09 | 121 | 804 | 2 | 229 |\n| 11/06 | 4 | 105 | 24 | 952 |\n| 11/05 | 5 | 167 | 56 | 857 |\n| 11/04 | 20 | 438 | 2 | 544 |\n| 11/03 | 2 | 58 | 33 | 1,000 |\n| 11/02 | 10 | 518 | 5 | 447 |\n| 10/30 | 4 | 92 | 11 | 941 |\n\n近一個月多次出現下跌家數約 950 到 1,000 家的日子（10/30、11/03、11/06），表示高波動狀態早已存在，11/16 以後的急殺是延續，不是突然發生。\n\n## 七、外部環境\n美股數字為 [Yahoo Finance](https://finance.yahoo.com/) 日線資料（沒有找到可取得的官方資料）；美元兌台幣為[期交所每日外幣參考匯率](https://openapi.taifex.com.tw/v1/DailyForeignExchangeRates)。完整收盤表見 [11/21 非交易日日報第二節](#2026-11-21-s2)。\n- **費半：** 11/20 收 8,408.59（-10.73%），比近一個月高點 11,684 低約 28.0%。意思：半導體族群被大量賣出；台股電子權值股的走勢與它高度連動。\n- **標普 500：** 11/20 收 6,910.39（-3.70%），比近一個月高點 7,757 低約 10.9%。跌幅比費半小，說明下跌集中在科技與半導體。\n- **美國 VIX：** 11/20 收 35.89（月初約 17），換算約是美股預期每天震盪約 2.3%。與台灣 VIX 在不同市場，水位不可直接比較。\n- **美元兌台幣：** 11/20 為 32.936，前一日 32.942；外資賣股把錢匯出，會讓台幣貶值，目前沒有明顯貶值，離 33 約 0.2%。\n## 八、近日新聞與事件（11/06 到 11/20）\n### 8.1 時間線\n| 日期 | 事件 | 對應數據 |\n|---|---|---|\n| 11/06（五） | 加權收 39,701.64，-1,873.08 點（-4.51%）；盤中最低 37,837.05，較前一日收盤低 3,737.67 點，是證交所 2024 年 1 月以來資料中最大的盤中跌點（[證交所](https://www.twse.com.tw/rwd/zh/TAIEX/MI_5MINS_HIST?date=20261101\u0026response=json)）。國安基金 14:30 召開第 131 次臨時委員會議，決定啟動安定市場任務（[財政部 11/06 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=d76cfbf3f67840568607d7bcbe1d7962)） | 上市股票上漲 105／下跌 952（[證交所](https://www.twse.com.tw/rwd/zh/afterTrading \u0026days=60\u0026date=20261120)） |\n\n### 8.2 市場關心的主要因素\n1. **AI 基礎建設放緩的疑慮。** 事實：[經濟日報 11/09 盤前報導](https://money.udn.com/money/amp/story/5607/9865999)，11/06 的急殺與美國期中選舉後民主黨勢力上升有關，有議員呼籲暫停興建資料中心、德州新當選州長表態暫緩開發案審批，市場擔心全美近四成規劃中的 AI 資料中心可能被暫停審批。費半 11/20 收盤比近一個月高點低約 28%（[Yahoo Finance](https://finance.yahoo.com/quote/%5ESOX/history/)）。為什麼影響台股：資料中心少蓋，就會少買 AI 伺服器和晶片，台積電等台灣公司靠這些訂單成長，預期變差就被賣出。\n2. **輝達執行長黃仁勳辭職（因果見 [8.6](#2026-11-20-s8-6)）。** 事實：11/12 輝達董事會宣布他即日辭去總裁、執行長與董事職務，官方未說明原因（[SEC 公告](https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm)）。為什麼影響台股：輝達是 AI 晶片龍頭，它領導層不穩，市場會重新評估整個 AI 題材。但台股在消息後的第一個交易日（11/13）反而上漲 1.35%，真正暴跌是 11/16 之後，所以辭職是背景，不是單一主因。\n3. **槓桿出清。** 事實：融資單日 -491.41 億（降幅 10.15%），兩日合計 -728 億；官方追繳戶數 11/19 為 2,947 戶（追繳 29.64 億，預計處分 520 戶、9.18 億），11/20 增到 6,462 戶（見 [4.1](#2026-11-20-s4-1)）。為什麼影響台股：強制賣出會再壓低股價，形成連鎖循環（機制見[第一節第 2 點](#2026-11-20-s1-p2)）。\n4. **自營商避險賣出。** 事實：11/20 自營商賣超約 341 億，其中避險約 290 億（[證交所](https://www.twse.com.tw/rwd/zh/fund/BFI82U?dayDate=20261120\u0026type=day\u0026response=json)）。為什麼影響台股：自營商賣選擇權或權證給投資人後，要用股票或期貨對沖風險，股價下跌時就得跟著賣出對沖部位，是被動賣出；指數穩住時會買回。\n5. **美國對先進晶片的管制與輝達對中國的出貨。** 事實：輝達財測不含中國資料中心運算營收（[輝達新聞稿](https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-third-quarter-fiscal-2027)）；上一季（到 10/25）輝達 Hopper 系列資料中心產品對中國出貨 24 億美元（[輝達 CFO 評論](https://www.sec.gov/Archives/edgar/data/1045810/000104581026000088/q3fy27cfocommentary.htm)）。官方文件沒有的部分，來自媒體：美國商務部 11/16 收緊先進晶片管制（[鉅亨網](https://news.cnyes.com/news/id/6665670)）；輝達代理執行長 Kress 在 11/17 財報電話會議說，已停止出貨經許可的 Hopper 系列產品（包括 H200）到中國（[TweakTown](https://www.tweaktown.com/news/114771/nvidia-stops-shipping-licensed-hopper-ai-chips-including-h200-to-china/index.html)、[Digital Today](https://www.digitaltoday.co.kr/en/view/127494/nvidia-to-halt-h200-sales-to-china-after-jensen-huang-exit)；輝達官方財報文件沒有這句話）。為什麼可能影響台股：中國市場的營收不確定，會影響 AI 晶片供應鏈的獲利預期；它是風險背景，不是已證實的直接導火線。\n6. **美國利率與通膨（11/20 的美股下跌原因之一）。** 事實：聯準會理事庫克 [11/20 演講](https://www.federalreserve.gov/newsevents/speech/cook20261120a.htm)說，10 月 PCE 通膨估計年增 3.8%，聯準會 9 月已升息到 3.75% 到 4.00%，她在 10 月維持利率不動時投反對票、主張再升 0.25 個百分點，並說再等下去有「落後通膨」的風險。為什麼可能影響台股：利率走高，一般認為對估值高的科技股不利；這是 11/20 美股的原因，台股 11/23 才有對應的交易日。詳見 [11/21 非交易日日報的第一節第 1 點](#2026-11-21-s1-p1)。\n\n### 8.3 政策與護盤動向\n- **國安基金：** 11/06 14:30 臨時委員會議決定啟動安定市場任務（[財政部 11/06 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=d76cfbf3f67840568607d7bcbe1d7962)）；11/21 財政部新聞稿說已進場護盤（見 [11/21 非交易日日報第一節第 2 點](#2026-11-21-s1-p2)）。作用：政府的穩定基金在市場大跌時進場買股票，用來穩定或拉抬指數。\n- **金管會三波限空令：** 作用是限制放空，減少空方推波助瀾。\n  - 11/09 第一波：調整盤中借券賣出委託數量及融券保證金成數等措施（[金管會 11/19 新聞稿](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611190001\u0026dtable=News)提到）。\n  - 11/19 公告、11/20 生效的第二波：個股當日收盤跌幅達 3.5% 以上，次一交易日不得以低於前一交易日收盤價融券或借券賣出；盤中借券賣出委託數量上限由前 30 個營業日日均量的 3% 降到 1%；證券商與期貨商因避險等的賣出不受限（[金管會 11/19 新聞稿](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611190001\u0026dtable=News)）。\n  - 11/21 公告的第三波（11/23 起全面禁止平盤以下放空等 5 項）：見 [11/21 非交易日日報](#2026-11-21-s1-p2)。\n- **還沒有公告的研議：**\n  - 「放寬融資擔保維持率的計算」：讓較少借錢買股的人被通知補錢，減少強制賣出的連鎖循環。[聯合報 11/20](https://udn.com/news/story/7251/9891975)引述知情人士報導，行政院討論的選項包括全面禁止下跌股票放空，或放寬融資擔保維持率的計算，尚無細節。\n  - 國安基金規模從 5,000 億倍增至 1 兆元，需修法：增加政府能用來買股的資金（[三立 11/20](https://www.setn.com/news/1942451)）。現行 5,000 億是向金融機構借款最多 2,000 億（以國庫持股擔保）加向四大基金借款最多 3,000 億，實務上只用過金融機構借款的 2,000 億；國安基金報告建議把金融機構借款上限提高到 7,000 億、四大基金借款維持 3,000 億，財政部長莊翠雲表示持正面看法（[自由時報 11/11](https://ec.ltn.com.tw/article/breakingnews/5636788)）。\n- **證交所董事長林修銘（11/20）：** 表示融資餘額 11 月較 10 月高點減少逾 1,500 億元，違約交割及融資追繳處分尚未出現明顯異常，鼓勵公司實施庫藏股（公司買回自家股票，減少市場賣壓）（[經濟日報 11/20](https://udn.com/news/story/7251/9892045)）。\n\n### 8.4 個股與族群（證交所、櫃買中心每日收盤資料）\n- 台積電 11/20 盤中最低 1,970 元，收盤 2,000 元，前一日收 2,100 元，跌 4.76%（[證交所](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261120\u0026type=ALLBUT0999\u0026response=json)）。\n- 0050 收 84.45 元（-6.37%）；反向 ETF 00632R 收 12.52 元（+7.19%），反向 ETF 在指數下跌時獲利，所以逆勢上漲（[證交所](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261120\u0026type=ALLBUT0999\u0026response=json)）。\n- 信驊（5274，上櫃）11/19 收 8,730 元、11/20 收 7,860 元，連兩日跌停（[櫃買中心](https://www.tpex.org.tw/www/zh-tw/afterTrading/tradingStock?code=5274\u0026date=2026/11/20\u0026response=json)）。\n\n### 8.5 官方說法與數字\n- **財政部 11/06 新聞稿（[連結](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=d76cfbf3f67840568607d7bcbe1d7962)）：** 外資累計賣超 5,244 億元（至 11/06），10 月賣超 9,943.16 億元為單月紀錄。\n- **金管會 11/19 新聞稿（[連結](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611190001\u0026dtable=News)）：** 上市櫃公司 1 到 10 月營收約 56.75 兆元（+39.05%），前三季稅前盈餘約 6 兆 6,126 億元（+86.43%）；截至 11/18 有 39 家公司實施庫藏股，最高金額約 274.04 億元。\n- **財政部 11/21 新聞稿（[連結](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=722e9b57fd8c44efba51d94b1f7eb6e5)）：** 外資等雖多日賣超台股，但已漸趨收斂（沒有給數字）。對照證交所資料：外資 11/18、11/19、11/20 賣超 765.6、243.1、95.1 億（[11/18](https://www.twse.com.tw/rwd/zh/fund/BFI82U?dayDate=20261118\u0026type=day\u0026response=json)、[11/19](https://www.twse.com.tw/rwd/zh/fund/BFI82U?dayDate=20261119\u0026type=day\u0026response=json)、[11/20](https://www.twse.com.tw/rwd/zh/fund/BFI82U?dayDate=20261120\u0026type=day\u0026response=json)）。\n\n### 8.6 輝達執行長事件：因果鏈與後續追蹤\n官方來源：[SEC 公告](https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm)、[輝達財報新聞稿](https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-third-quarter-fiscal-2027)、[輝達 CFO 評論](https://www.sec.gov/Archives/edgar/data/1045810/000104581026000088/q3fy27cfocommentary.htm)、[眾議院中國特別委員會新聞稿](https://chinaselectcommittee.house.gov/media/press-releases/jensen-huang-and-nvidia-agree-to-appear-before-congress)。媒體另有關於私人行為與涉及中國情報的指控報導，輝達未證實，不引述細節（例如 [CNBC 即時頁面](https://www.cnbc.com/2026/11/12/nvidia-jensen-huang-ceo-live-updates.html)）。\n\n**事件經過**\n| 日期 | 事件 | 來源 |\n|---|---|---|\n| 11/08（日） | 輝達董事會表示信任黃仁勳，並啟動獨立調查；黃仁勳寫信給全體員工道歉 | 媒體：[CNBC](https://www.cnbc.com/2026/11/12/nvidia-jensen-huang-ceo-live-updates.html)、[PC Gamer 時間線](https://www.pcgamer.com/hardware/live/news/nvidia-jen-hsun-scandal/) |\n| **11/12（四）** | **董事會宣布黃仁勳辭去總裁、執行長與董事，即日生效；財務長 Colette Kress 任代理執行長；Harvey Jones 任首位董事長；展開接班人遴選。公告不含原因，黃仁勳未發言** | **官方：[SEC 公告](https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm)** |\n| 11/12 | 輝達股價收 166.19 美元，比前一日 173.73 美元低 4.3% | [Yahoo Finance](https://finance.yahoo.com/quote/NVDA/history/) |\n| 11/13（五，美股盤） | 費半 -3.43%（台股 11/13 當天 +1.35%，11/16 才大跌 -6.03%） | [Yahoo Finance](https://finance.yahoo.com/quote/%5ESOX/history/)、[證交所](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261116\u0026type=IND\u0026response=json) |\n| 11/16（一） | 美國商務部收緊先進晶片管制 | 媒體：[鉅亨網](https://news.cnyes.com/news/id/6665670) |\n| **11/17（二）** | **財報（Q3 FY2027）：營收 1,158.4 億美元（年增 103%）、調整後 EPS 2.68 美元、資料中心營收 1,076 億美元；下一季營收預估 1,300 億美元（±3%）；財測不含中國資料中心運算營收；上一季 Hopper 系列資料中心產品對中國出貨 24 億美元** | **官方：[輝達新聞稿](https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-third-quarter-fiscal-2027)、[CFO 評論](https://www.sec.gov/Archives/edgar/data/1045810/000104581026000088/q3fy27cfocommentary.htm)** |\n| 11/17 | 眾議院中國特別委員會公布：黃仁勳 12/1、輝達法務長 12/2 同意接受有逐字記錄的閉門訪談 | **官方：[眾議院中國特別委員會](https://chinaselectcommittee.house.gov/media/press-releases/jensen-huang-and-nvidia-agree-to-appear-before-congress)** |\n| 11/17 | 董事長 Jones 在財報電話會議說，董事會一致接受辭職、無意讓他回任執行長，辭職是因他揭露了與公司行為準則不符的個人行為，其他情況與調查不在會中討論 | 媒體：[鉅亨網](https://news.cnyes.com/news/id/6665670)（中文整理） |\n| 11/20 | 獵才公司已開始接觸接班人選，董事會說現在討論個別人選為時過早 | 媒體：[Newtalk](https://newtalk.tw/news/view/2026-11-20/1072260) 引述路透、FT、彭博 |\n\n**因果判讀（整理，非定論）**\n1. **辭職本身不是財務基本面利空。** 11/17 財報營收年增 103%，下一季營收預估 1,300 億美元。市場擔心的是領導層與治理的不確定性、對中國出貨的不確定性，以及對 AI 資本支出的疑慮（見 [8.2 第 1 點](#2026-11-20-s8-2-p1)）。\n2. **時間點顯示不是單一事件。** 台股 11/13（辭職消息後第一個交易日）反而收紅，11/16 才大跌，原因更像是 11/13 美股半導體重挫、管制消息、AI 基建放緩疑慮與槓桿出清疊加。\n3. **財報利多沒有止住台股。** 財報後台股 11/19、11/20 仍重挫，說明賣壓更偏向流動性、融資出清與避險，而不是對輝達基本面的重新評價。\n4. **仍有未解問題：** 董事會尚未說明辭職的完整原因。\n\n**後續追蹤清單**\n- 12/1 黃仁勳、12/2 輝達法務長接受眾議院委員會的閉門訪談（[眾議院中國特別委員會](https://chinaselectcommittee.house.gov/media/press-releases/jensen-huang-and-nvidia-agree-to-appear-before-congress)）。\n- 輝達接班人宣布與時程；董事會承諾的進一步說明。\n- 美國對中國晶片出口政策（管制細節、H200 供應）。\n- 台股面：外資與費半、台積電的連動是否持續。\n\n### 8.7 數據差異\n- **三大法人金額：** 證交所 BFI82U（[連結](https://www.twse.com.tw/rwd/zh/fund/BFI82U?dayDate=20261120\u0026type=day\u0026response=json)）11/20 為外資 -95.1、投信 -73.5、自營商 -340.9、合計 -509.4 億；新聞報導（[壹蘋](https://news.nextapple.com/finance/20261120/38901D84CD9518A08BFB3181CE81917F)、[Newtalk](https://tw.news.yahoo.com/%E5%8F%B0%E8%82%A1%E7%88%86%E5%A4%9A%E6%AE%BA%E5%A4%9A-%E5%A4%A7%E7%9B%A4%E7%8B%82%E7%80%892-393%E9%BB%9E-368%E6%AA%94%E8%B7%8C%E5%81%9C-%E5%A4%96%E8%B3%87%E5%83%85%E8%B3%A3%E8%B6%8594%E5%84%84-072753299.html)）寫外資 -94.13、投信 -87.49、自營商 -340.84、合計 -522.46 億。差異（尤其投信）原因不明；本日報採用證交所數字。\n- **漲跌家數：** 新聞用「上市＋櫃買」口徑（上漲 66、下跌 1,896），本日報用上市股票口徑（上漲 16、下跌 1,058），不是同一個基準。\n\n## 九、資料來源與限制\n- **官方資料：**\n  - 證交所：[大盤統計與收盤行情](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261120\u0026type=MS\u0026response=json)、[融資融券](https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date=20261120\u0026selectType=MS\u0026response=json)、[三大法人](https://www.twse.com.tw/rwd/zh/fund/BFI82U?dayDate=20261120\u0026type=day\u0026response=json)、臺股儀表板（[整戶維持率與追繳處分](https://www.twse.com.tw/rwd/zh/marginTrading/BFIJ3U_TREND?response=json\u0026days=10\u0026date=20261120)、[借券賣出餘額](https://www.twse.com.tw/rwd/zh/IIH/market/lending?start=20261105\u0026end=20261120\u0026response=json)、[借券賣出成交值](https://www.twse.com.tw/rwd/zh/marginTrading/TWIEIU_TREND?response=json\u0026days=12\u0026date=20261120)、[融資餘額趨勢](https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN_TREND?response=json\u0026days=60\u0026date=20261120)、[當沖](https://www.twse.com.tw/rwd/zh/dayTrading/TWTB4U?date=20261120\u0026response=json)）、[加權指數日資料](https://www.twse.com.tw/rwd/zh/TAIEX/MI_5MINS_HIST?date=20261101\u0026response=json)、[類股指數](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261116\u0026type=IND\u0026response=json)；[櫃買中心個股日成交](https://www.tpex.org.tw/www/zh-tw/afterTrading/tradingStock?code=5274\u0026date=2026/11/20\u0026response=json)。\n  - 期交所：[三大法人期貨](https://www.taifex.com.tw/cht/3/futContractsDate)、[Put/Call 比](https://openapi.taifex.com.tw/v1/PutCallRatio)、[台灣 VIX 月檔](https://www.taifex.com.tw/file/taifex/Dailydownload/vix/log2data/202611new.txt)、[每日外幣參考匯率](https://openapi.taifex.com.tw/v1/DailyForeignExchangeRates)。\n  - 金管會：[11/19 新聞稿](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611190001\u0026dtable=News)、[11/21 新聞稿](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611210001\u0026dtable=News)。財政部：[11/06 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=d76cfbf3f67840568607d7bcbe1d7962)、[11/21 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=722e9b57fd8c44efba51d94b1f7eb6e5)。\n  - 輝達：[SEC 公告](https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm)、[財報新聞稿](https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-third-quarter-fiscal-2027)、[CFO 評論](https://www.sec.gov/Archives/edgar/data/1045810/000104581026000088/q3fy27cfocommentary.htm)；[眾議院中國特別委員會](https://chinaselectcommittee.house.gov/media/press-releases/jensen-huang-and-nvidia-agree-to-appear-before-congress)；[聯準會理事庫克演講](https://www.federalreserve.gov/newsevents/speech/cook20261120a.htm)。\n- 限制：外資台指期淨未平倉僅含臺股期貨（TXF），不含小型台指與選擇權。資料由 AI 協助整理，作者已查核。資料來源已列於各項連結；內容為資料彙整與歷史型態解讀，不含對未來走勢的預測，不構成投資建議，無任何金融商品買賣建議，投資人應自行判斷與承擔風險。\n"}]</script>

  function goBack() {
    var last = trail.pop();
    if (!last) { updateBack(); return; }
    if (last.date !== currentDate) show(last.date, false);
    window.scrollTo(0, last.y);
    updateBack();
  }
  backEl.addEventListener('click', goBack);

  function show(date, scrollTop) {
    var r = data.filter(function (x) { return x.date === date; })[0] || data[0];
    if (!r) { bodyEl.innerHTML = '<p class="empty">目前沒有日報。</p>'; return; }
    currentDate = r.date;
    Array.prototype.forEach.call(datesEl.children, function (c) {
      if (c.dataset.date === r.date) c.setAttribute('aria-current', 'true'); else c.removeAttribute('aria-current');
    });
    var md = String(r.md).replace(/</g, '&lt;').replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
    if (window.marked) {
      bodyEl.innerHTML = marked.parse(md, { mangle: false, headerIds: false, breaks: false });
    } else {
      bodyEl.textContent = r.md;
    }
    Array.prototype.forEach.call(bodyEl.querySelectorAll('table'), function (t) {
      var w = mk('div', 'tbl-wrap'); t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
    Array.prototype.forEach.call(bodyEl.querySelectorAll('h2, h3'), function (h) {
      var k = keyOf(h); if (k) h.id = r.date + '-s' + k;
    });
    Array.prototype.forEach.call(bodyEl.querySelectorAll('a'), function (a) {
      var href = a.getAttribute('href') || '', m = href.match(REF_RE);
      if (m) {
        a.classList.add('ref');
        a.title = '跳到「' + a.textContent + '」，讀完可按下方按鈕返回';
        a.addEventListener('click', function (ev) { ev.preventDefault(); goRef(m[1], m[2] || '', m[3] ? parseInt(m[3], 10) : 0); });
      } else { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    });
    Array.prototype.forEach.call(bodyEl.querySelectorAll('p'), function (p) {
      if (/^一句話/.test(p.textContent)) p.classList.add('callout');
    });
    tocEl.innerHTML = '';
    Array.prototype.forEach.call(bodyEl.querySelectorAll('h2'), function (h, i) {
      if (!h.id) h.id = 'sec-' + i;
      var b = mk('button', 'chip', h.textContent.replace(/^\s+|\s+$/g, ''));
      b.type = 'button';
      b.addEventListener('click', function () { h.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
      tocEl.appendChild(b);
    });
    footEl.textContent = '共 ' + data.length + ' 期日報，目前顯示 ' + (r.label || r.date) + '。';
    var fb = document.createElement('div');
    fb.style.marginTop = '8px';
    fb.appendChild(document.createTextNode('資料有誤或有閱讀建議，歡迎'));
    var fa = document.createElement('a');
    fa.href = 'https://forms.gle/T6gnpxPkbpoKLeSW9';
    fa.target = '_blank'; fa.rel = 'noopener noreferrer';
    fa.textContent = '填寫回饋表單';
    fb.appendChild(fa);
    fb.appendChild(document.createTextNode('（不接受個股買賣諮詢，也不會逐一回覆）。'));
    footEl.appendChild(fb);
    if (scrollTop) window.scrollTo(0, 0);
    updateBack();
  }

  data.forEach(function (r) {
    var b = mk('button', 'chip', r.label || r.date);
    b.type = 'button'; b.dataset.date = r.date;
    b.addEventListener('click', function () {
      trail = [];
      try { location.hash = r.date; } catch (e) {}
      show(r.date, true);
    });
    datesEl.appendChild(b);
  });

  function fromHash() {
    var h = (location.hash || '').replace(/^#/, '');
    return DATE_RE.test(h) ? h : (data[0] && data[0].date);
  }
  window.addEventListener('hashchange', function () { trail = []; show(fromHash(), true); });
  show(fromHash(), false);
})();
</script>
