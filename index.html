<script type="application/json" id="reports">[{"date":"2026-11-23","label":"2026-11-23","kind":"trading","title":"台股大盤日報｜2026-11-23（一）","md":"# 台股大盤日報｜2026-11-23（一）\r\n\r\n資料截止：2026-11-23 台股收盤。\r\n\r\n**更新時間：2026-11-23 21:25（台北時間）**\r\n\r\n## 一、重點結論\r\n**一句話：** 加權指數 11/23 收 36,811.89，+778.60 點（+2.16%），盤中最低 35,442.41、最高 37,108.20；證交所公告，整戶擔保維持率的追繳門檻 11/24 起由 130% 降到 120%，11/24 前的追繳紀錄一律取消。\r\n\r\n1. **11/23 加權指數收 36,811.89，+778.60 點（+2.16%），比 11/11 的最高點 44,257.15 低 16.8%。**\r\n   - **盤中：** 開 35,899.48（比前一日收盤低 133.81 點），最低 35,442.41，最高 37,108.20，高低相差 1,665.79 點，收盤比最低點高 1,369.48 點（[NOWnews](https://www.nownews.com/news/6894765)、[ETtoday](https://finance.ettoday.net/news/3277068)、[TVBS](https://news.tvbs.com.tw/money/4055015)）。\r\n   - **台積電：** 收 2,030 元，+30 元（+1.50%）（[NOWnews](https://www.nownews.com/news/6894765)）。\r\n   - **廣度：** 上市股票 652 檔上漲、362 檔下跌，43 檔漲停、9 檔跌停；443 檔（約 43%）創一年新低，比 11/20 的 488 檔少（[證交所](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261123\u0026type=MS\u0026response=json)、自行計算，標準見[第七節](#2026-11-23-s7)）。\r\n\r\n2. **證交所公告：整戶擔保維持率追繳門檻 11/24 起由 130% 降到 120%，11/24 前的追繳紀錄一律取消、不處分擔保品。**\r\n   - **公告內容（[聯合報 15:21](https://udn.com/news/story/7251/9896524)、[台視 15:24](https://tw.news.yahoo.com/%E8%AD%89%E4%BA%A4%E6%89%80%E5%85%AC%E5%91%8A-11-24%E8%B5%B7%E8%9E%8D%E8%B3%87%E6%93%94%E4%BF%9D%E7%B6%AD%E6%8C%81%E7%8E%87%E9%99%8D%E8%87%B3120-24%E6%97%A5%E5%89%8D%E8%BF%BD%E7%B9%B3%E7%B4%80%E9%8C%84%E5%8F%96%E6%B6%88-072440583.html)、[中時 15:50](https://www.chinatimes.com/realtimenews/20261123003191-260410)）：**\r\n     - **實施日：** 11/24 起實施，原因是考量券商系統調整需要時間。\r\n     - **新門檻：** 11/24 起，信用帳戶收盤後計算的整戶擔保維持率低於 120% 才發出追繳通知，投資人在通知送達日起 2 個營業日內補繳差額。\r\n     - **舊追繳紀錄：** 11/24 前維持率低於 130%、已被通知補繳的，一律取消追繳紀錄，不處分擔保品；投資人可以自行用委託買賣了結融資融券部位。\r\n     - **11/23 當天：** 原則上不用再通知；券商作業還沒調整完成的，11/23 可依規定通知，11/24 起一律照新措施。\r\n     - **擔保品：** 有流動性、能合理評價的其他擔保品，經券商同意可以抵繳。\r\n   - **整戶維持率與處分戶數（證交所儀表板）：** 低於 130% 的 6,462 戶、預計 11/23 處分 632 戶、約 14.95 億；11/23 為低於 130% 的 2,677 戶、預計 11/24 處分 224 戶、約 3.62 億（見[第五節](#2026-11-23-s5)）。11/23 實際處分戶數，待補。\r\n\r\n3. **金管會五項措施 11/23 生效；國安基金護盤。**\r\n   - **限空令：** 11/23 起，融券賣出與借券賣出上市（櫃）股票和 TDR，價格不得低於前一營業日收盤價；融券保證金成數由 130% 調高到 150%（內容見 [11/21 非交易日日報第一節第 2 點](#2026-11-21-s1-p2)）。生效首日 11/23 融券賣出 29,143 張，11/20 為 36,002 張（[證交所](https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date=20261123\u0026selectType=MS\u0026response=json)）；借券賣出成交，待補。\r\n   - **國安基金：** 財政部 11/21 新聞稿說已進場護盤，沒有公布買進金額與進場日期（[財政部 11/21 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=722e9b57fd8c44efba51d94b1f7eb6e5)）；今周刊寫 11/6 已啟動（[今周刊 18:00](https://www.businesstoday.com.tw/article/category/183017/post/202611230041/)）；11/23 同樣沒有公布金額。\r\n\r\n4. **行政院長卓榮泰 11/23 召開產金座談，表示願意檢討國安基金規模。**\r\n   - **行政院座談：** 出席者 27 位產金代表；卓榮泰稱國安基金規模「願意正面、積極檢討」，沒有提金額或時程（[鏡週刊 10:07](https://www.mirrormedia.mg/external/mirrordaily_99770)、[今周刊 18:00](https://www.businesstoday.com.tw/article/category/183017/post/202611230041/)）。\r\n   - **證交所與券商：** 證交所 11/22 召集 10 家大型券商開會，券商表示「願意共體時艱全力支持及配合」（[經濟日報 17:08](https://money.udn.com/money/story/5607/9896751)）；證交所宣布時間見[中央社 15:05](https://www.cna.com.tw/news/afe/202611230142.aspx)。\r\n   - **處置股：** 金管會主委彭金隆說，處置股制度 11/27 開會討論（[今周刊 18:00](https://www.businesstoday.com.tw/article/category/183017/post/202611230041/)）。\r\n   - **庫藏股：** 金管會宣布，庫藏股在 115 年度至 116 年第 1 季屆滿或執行完畢者，可納入 115 年 ESG 評鑑指標得分；證交所董事長林修銘致函上市公司鼓勵庫藏股與法說會（[今周刊 18:00](https://www.businesstoday.com.tw/article/category/183017/post/202611230041/)）。\r\n\r\n5. **外資連 6 個交易日賣超，累計 2,476.18 億；外資期貨淨空單 103,432 口。**\r\n   - **現貨（億）：** 外資 -289.5、投信 -32.3、自營商 -190.0（自行買賣 -29.0、避險 -161.0），三大法人合計 -511.8（[證交所](https://www.twse.com.tw/rwd/zh/fund/BFI82U?dayDate=20261123\u0026type=day\u0026response=json)）。\r\n   - **外資連 6 日賣超（億）：** 701.9（11/16）、380.9、765.6、243.1、95.1、289.5（11/23），比 11/20 的 95.1 億多。\r\n   - **期貨：** 外資台指期淨未平倉 -103,432 口，比 11/20 的 -97,863 口多 5,569 口空單（[期交所](https://www.taifex.com.tw/cht/3/futContractsDate)）。\r\n\r\n6. **台灣 VIX 55.47，比 11/20 的 52.20 高 3.27，是 11/12 以來最高。**\r\n\r\n## 二、近日新聞與政策進度\r\n### 2.1 護盤措施進度\r\n| 項目 | 狀態 | 出處 |\r\n|---|---|---|\r\n| 金管會五項措施（含限空令） | 11/23 起生效 | [金管會 11/21 新聞稿](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611210001\u0026dtable=News) |\r\n| 整戶擔保維持率 130% 降到 120% | 證交所公告 11/24 起實施，11/24 前追繳紀錄取消 | 證交所公告（見[第一節第 2 點](#2026-11-23-s1-p2)） |\r\n| 國安基金 | 財政部 11/21 稿說已進場；沒有公布金額 | [財政部 11/21 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=722e9b57fd8c44efba51d94b1f7eb6e5) |\r\n| 國安基金規模檢討 | 卓榮泰 11/23 說願意積極檢討，沒有金額與時程 | [鏡週刊 11/23](https://www.mirrormedia.mg/external/mirrordaily_99770) |\r\n| 處置股制度 | 金管會主委說 11/27 開會討論 | [今周刊 11/23](https://www.businesstoday.com.tw/article/category/183017/post/202611230041/) |\r\n| 國安基金規模倍增到 1 兆元 | 需立法院修法，沒有看到修法進度 | [三立 11/20](https://www.setn.com/news/1942451) |\r\n\r\n### 2.2 輝達與 AI 供應鏈\r\n- **事實與調查：** 詳見 [11/21 非交易日日報第一節第 4 點](#2026-11-21-s1-p4)。\r\n- **後續時程：** 12/1 黃仁勳、12/2 輝達法務長接受眾議院委員會的閉門訪談；完整事件脈絡見 [11/20 日報的 8.6](#2026-11-20-s8-6)。\r\n\r\n## 三、接下來要看\r\n1. **美股 11/23 收盤：** 台股 11/24 開盤前的外部資料。\r\n2. **11/24 整戶維持率與追繳戶數：** 證交所儀表板 11/24 的數字；11/23 為維持率 159.42%、低於 130% 的 2,677 戶（11/20 為 151.78%、6,462 戶）。\r\n3. **11/23 實際處分戶數與金額：** 11/20 預計 632 戶、14.95 億；實際，待補。儀表板 11/23 的預計 11/24 處分為 224 戶、3.62 億；證交所公告 11/24 前的追繳紀錄一律取消、不處分擔保品。\r\n4. **限空令生效後的借券賣出成交：** 11/20 為 25.62 億元，11/23 待補。融券賣出 11/23 為 29,143 張，11/20 為 36,002 張。\r\n5. **外資現貨與期貨：** 賣超是否持續，期貨淨空單是否繼續增加。\r\n6. **國安基金與「擴大規模」：** 買進金額沒有公布；擴大規模需立法院修法，沒有看到進度（見 [11/21 非交易日日報 3.1](#2026-11-21-s3-1)）。\r\n7. **輝達事件後續：** 接班人、12/1 國會訪談、SEC 調查（見 [11/21 非交易日日報第一節第 4 點](#2026-11-21-s1-p4)）。\r\n\r\n## 四、每日資料（11/10 到 11/23）\r\n**表 A：指數、廣度與波動**\r\n| 日期 | 加權指數 | 漲跌% | 上漲／下跌¹ | 漲停／跌停¹ | 成交值(億)² | 創新低家數³ | 台灣 VIX |\r\n|---|---|---|---|---|---|---|---|\r\n| 11/10 | 42,711.92 | +2.52 | 526／491 | 30／2 | 9,322 | 33 | 40.06 |\r\n| 11/11 | 44,257.15 | +3.62 | 634／368 | 34／3 | 7,912 | 29 | 38.34 |\r\n| 11/12 | 43,091.87 | -2.63 | 277／730 | 12／10 | 9,592 | 19 /11 的 44,257.15 到 11/23 的 36,811.89，-16.8%；11/20 到 11/23，+2.16%。\r\n- 外資現貨：11/16 到 11/23 連續 6 天賣超，累計 2,476.18 億。\r\n\r\n## 五、槓桿與籌碼\r\n- **融資與整戶維持率：** 11/23 融資餘額 4,338 億，比 11/20 的 4,352 億少 14 億；融券餘額 172,957 張，11/20 為 199,791 張；11/23 融券賣出 29,143 張、融券回補（買進）47,929 張，11/20 為 36,002 張與 31,761 張（[證交所融資融券餘額](https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date=20261123\u0026selectType=MS\u0026response=json)）。證交所儀表板 11/23：整戶擔保維持率 159.42%（11/20 為 151.78%），低於 130% 的 2,677 戶（11/20 為 6,462 戶），追繳金額 2.6 億（11/20 為 64.64 億），預計 11/24 處分 224 戶、3.62 億（11/20 預計 11/23 處分 632 戶、14.95 億）。11/23 實際處分戶數，待補（[證交所臺股儀表板](https://www.twse.com.tw/dashboard/zh/index.html)；機制與完整表格見 [11/20 日報第四節](#2026-11-20-s4)）。\r\n- **借券與當沖：** 11/23 當沖比 29.22%（當沖成交 4,660,772 張，11/20 為 26.10%；[證交所](https://www.twse.com.tw/rwd/zh/dayTrading/TWTB4U?date=20261123\u0026response=json)）；借券賣出成交值與餘額，待補。11/20 借券賣出成交值 25.62 億元（0.27%），比 11/19 以前每天約 112 到 176 億大幅減少。\r\n- **三大法人現貨（11/23，億，[證交所](https://www.twse.com.tw/rwd/zh/fund/BFI82U?dayDate=20261123\u0026type=day\u0026response=json)）：** 外資 -289.5、投信 -32.3、自營商自行買賣 -29.0、自營商避險 -161.0，合計 -511.8。\r\n- **外資個股（[TVBS](https://news.tvbs.com.tw/money/4055015)）：** 外資賣超最多的是 0050（元大台灣50）37,983 張；外資買超最多的是 00406A 200,129 張；台積電外資賣超 11,039 張。\r\n\r\n## 六、期貨、選擇權與情緒\r\n- **外資台指期淨未平倉 -103,432 口（11/23，比 11/20 多 5,569 口空單；[期交所](https://www.taifex.com.tw/cht/3/futContractsDate)）。** 外資在台指期貨上持有的空單比多單多約 10.3 萬口；11/11 到 11/20 在 -96,787 到 -104,271 口之間。這裡只含臺股期貨 TXF。\r\n- **投信台指期淨未平倉 +93,565 口（11/23）。** 11/20 為 +87,599 口。\r\n- **台灣 VIX 55.47（11/23，比前一天 +3.27；[期交所](https://www.taifex.com.tw/file/taifex/Dailydownload/vix/log2data/202611new.txt)）。** 約等於市場預期接下來一個月加權指數平均每天上下震盪 3.5%（55.47 除以 √252）；11/20 為 52.20（約 3.3%）。**它只說明震盪會多大，不說明漲跌方向。**\r\n- **選擇權 Put/Call 比（[期交所](https://openapi.taifex.com.tw/v1/PutCallRatio)晚一天公布，最新為 11/20）：** 成交量比 78.96%、未平倉比 30.05%；11/19 為 73.38%、41.00%。11/23 的數字待補。\r\n\r\n## 七、廣度與創新高低\r\n- **漲跌家數（上市股票，[證交所大盤統計資訊](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261123\u0026type=MS\u0026response=json)）：** 11/23 上漲 652（漲停 43）、下跌 362（跌停 9）；11/20 為上漲 16（漲停 4）、下跌 1,058（跌停 179）。\r\n- **創新高／創新低家數（用[證交所每日收盤行情](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261123\u0026type=ALLBUT0999\u0026response=json)自行計算）：** 指當天股價創下過去 250 個交易日（約一年）新高或新低的股票數。11/23 創新高 1 檔（0.1%）、創新低 443 檔（43.5%）；11/20 創新低 488 檔（47.9%）。計算方式：用盤中高低價對照前 250 個交易日，約 1,019 檔 4 位數一般股票，不含 ETF，未調整除權息。\r\n\r\n## 八、外部環境\r\n美股數字為 [Yahoo Finance](https://finance.yahoo.com/) 日線；11/23（週一）美股在台北 11/23 晚上開盤，最新一筆收盤是 11/20。美元兌台幣 11/23 下午 3 點報 32.911（[Newtalk](https://newtalk.tw/news/view/2026-11-23/1073277)）。\r\n- **費半：** 11/20 收 8,408.59（-10.73%）。\r\n- **標普 500：** 11/20 收 6,910.39（-3.70%）。\r\n- **美國 VIX：** 11/20 收 35.89。\r\n- **完整 11/20 收盤表：** 見 [11/21 非交易日日報第二節](#2026-11-21-s2)。\r\n\r\n## 九、資料來源與限制\r\n- **官方資料：** [證交所大盤統計資訊](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261123\u0026type=MS\u0026response=json)、[證交所三大法人](https://www.twse.com.tw/rwd/zh/fund/BFI82U?dayDate=20261123\u0026type=day\u0026response=json)、[證交所臺股儀表板](https://www.twse.com.tw/dashboard/zh/index.html)、[期交所三大法人期貨](https://www.taifex.com.tw/cht/3/futContractsDate)、[期交所 VIX](https://www.taifex.com.tw/file/taifex/Dailydownload/vix/log2data/202611new.txt)、[金管會 11/21 新聞稿](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611210001\u0026dtable=News)、[財政部 11/21 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=722e9b57fd8c44efba51d94b1f7eb6e5)。\r\n- **媒體報導：** [聯合報](https://udn.com/news/story/7251/9896524)、[台視（Yahoo 轉載）](https://tw.news.yahoo.com/%E8%AD%89%E4%BA%A4%E6%89%80%E5%85%AC%E5%91%8A-11-24%E8%B5%B7%E8%9E%8D%E8%B3%87%E6%93%94%E4%BF%9D%E7%B6%AD%E6%8C%81%E7%8E%87%E9%99%8D%E8%87%B3120-24%E6%97%A5%E5%89%8D%E8%BF%BD%E7%B9%B3%E7%B4%80%E9%8C%84%E5%8F%96%E6%B6%88-072440583.html)、[中時](https://www.chinatimes.com/realtimenews/20261123003191-260410)、[工商時報](https://www.ctee.com.tw/news/20261123700047-439901)、[壹蘋新聞網](https://news.nextapple.com/finance/20261123/4229DF5288D140D9BB5AD98CA4D1369B)、[鏡週刊](https://www.mirrormedia.mg/external/mirrordaily_99770)、[今周刊](https://www.businesstoday.com.tw/article/category/183017/post/202611230041/)、[經濟日報](https://money.udn.com/money/story/5607/9896751)、[中央社](https://www.cna.com.tw/news/afe/202611230142.aspx)、[NOWnews](https://www.nownews.com/news/6894765)、[ETtoday](https://finance.ettoday.net/news/3277068)、[Newtalk](https://newtalk.tw/news/view/2026-11-23/1073277)、[TVBS](https://news.tvbs.com.tw/money/4055015)。\r\n- 限制：所有「最新」數字都是抓取當下的快照。資料由 AI 協助整理，作者已查核。資料來源已列於各項連結；內容為資料彙整與歷史型態解讀，不含對未來走勢的預測，不構成投資建議，無任何金融商品買賣建議，投資人應自行判斷與承擔風險。\r\n"},{"date":"2026-11-21","label":"2026-11-21 非交易日","kind":"nontrading","title":"台股非交易日日報｜2026/11/21（六）～11/22（日）","md":"# 台股非交易日日報｜2026/11/21（六）～11/22（日）\r\n\r\n- **涵蓋期間：** 11/21（六）、11/22（日），到 11/23（週一）有新的交易日日報為止\r\n- **更新內容：** 美股、週末新聞與政策、下一個交易日的觀察重點（沒有新的盤面數據）\r\n- **台股籌碼與槓桿：** 見 [2026-11-20 日報](#2026-11-20)\r\n\r\n**更新時間：2026-11-22 23:57（台北時間）**\r\n\r\n## 一、重點結論\r\n**一句話：** 金管會公告 11/23 起全面禁止平盤以下放空，財政部說國安基金已進場護盤；美股 11/20 收盤費半 -10.73%，台指期夜盤收盤比 11/20 結算價低 5.25%。\r\n\r\n1. **美股 11/20 收盤費半 -10.73%，台指期夜盤收盤比結算價低 5.25%。**\r\n   - **發生什麼事：** 美股 11/20 收盤（[Yahoo Finance](https://finance.yahoo.com/)）：\r\n     - **指數：** 半導體指數（費半）-10.73%、那斯達克 -5.28%、標普 500 -3.70%\r\n     - **台灣相關：** 輝達 -14.01%、台積電在美國掛牌的股票（ADR）-9.48%、追蹤台灣股市的美國 ETF（EWT）-10.95%\r\n     - **同一天其他晶片股：** 美光 -13.89%、超微（AMD）-13.25%、博通 -12.19%、日月光 ADR -13.84%、聯電 ADR -10.15%（[Stock Titan 全日整理](https://www.stocktitan.net/articles/stock-market-today-live-november-20-2026)）。\r\n   - **台指期夜盤：**\r\n     - **收盤：** 11/21 凌晨收 33,919 點（[期交所行情資訊網站](https://mis.taifex.com.tw/futures/)）\r\n     - **和結算價比：** 比 11/20 的台指期結算價 35,800 點（[期交所](https://openapi.taifex.com.tw/v1/DailyMarketReportFut)）低 1,881 點（-5.25%）\r\n     - **和現貨比：** 和台股現貨週五收盤 36,033.29 點相比，低約 2,114 點（-5.87%）\r\n     - **夜盤是什麼：** 夜盤是台灣期貨市場在台股休市時的交易，成交價是台指期的價格，不是台股現貨價格。\r\n   - **夜盤與 ADR 的數字：** 台積電 ADR 11/20 跌 9.48%，夜盤收盤比台股現貨週五收盤低 5.87%。夜盤成交價不等於週一的開盤價；台股單日跌幅上限是 10%。\r\n   - **美股為什麼跌：**\r\n     - **AI 投資能不能賺回來的疑慮：** 市場質疑 AI 基礎建設的大量投資是否能產生足夠報酬（CNBC 報導，經 [Stock Titan](https://www.stocktitan.net/articles/stock-market-today-live-november-20-2026) 轉引）。財政部 11/21 新聞稿把美股下跌歸因於美國 AI 監管疑慮、資本支出報酬與融資風險（[財政部 11/21 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=722e9b57fd8c44efba51d94b1f7eb6e5)）。\r\n     - **聯準會理事庫克主張再升息：** 她 11/20 在智利央行年會的[演講全文](https://www.federalreserve.gov/newsevents/speech/cook20261120a.htm)說：\r\n       - **通膨：** 美國 10 月 PCE 通膨估計年增 3.8%（扣除食品與能源的核心為 3.2%）\r\n       - **利率：** 聯準會 9 月已把利率升到 3.75% 到 4.00%，10 月維持不動時她投了反對票，主張再升 0.25 個百分點\r\n       - **她的看法：** 再等下去，升息有落後通膨的風險（behind the curve）；一旦落後，之後可能需要更多、更大幅度的升息\r\n     - **Anthropic 上市後股價回落，** 拖累持有它的亞馬遜與 Alphabet（[24/7 Wall St](https://247wallst.com/investing/2026/11/20/stock-market-today-anthropics-mega-ipo-sends-stocks-lower-for-a-second-day/)）。\r\n\r\n2. **金管會公告五項措施，11/23（週一）起生效。**\r\n   - **官方原文（[金管會 11/21 新聞稿](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611210001\u0026dtable=News)）：**\r\n     1. **全面禁止平盤以下放空：** 融券賣出與借券賣出上市（櫃）股票和台灣存託憑證（TDR），賣出價格不得低於前一營業日收盤價。例外：證券商與期貨商因業務避險需求的融券和借券賣出。\r\n     2. **融券保證金成數由 130% 調高到 150%：** 放空要先拿出的保證金變多。\r\n     3. **暫停受理證券商申請發行認售權證上市（櫃）。**\r\n     4. **鼓勵上市（櫃）公司實施庫藏股：** 在 115 年第 4 季到 116 年第 1 季期間屆滿或執行完畢的，可納入 115 年 ESG 評鑑加分。庫藏股就是公司買回自己的股票。\r\n     5. **鼓勵金融機構等出借人暫停對外出借股票，** 已出借的視契約提前召回或到期不再續借。\r\n   - **這三波限空令的差別：**\r\n     - **11/9 第一波：** 先調整盤中借券賣出委託數量與融券保證金成數\r\n     - **第二波（11/19 公告、11/20 生效；[金管會 11/19 新聞稿](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611190001\u0026dtable=News)）：** 只針對「當日收盤跌幅達 3.5% 以上」的個股，次一交易日不得低於前一營業日收盤價放空，並把盤中借券賣出委託數量上限由前 30 營業日日均量的 3% 降到 1%\r\n     - **第三波（11/21 公告、11/23 生效）：** 把「跌幅 3.5%」這個條件拿掉，變成所有上市櫃股票都適用。\r\n   - **限空令相關數據：**\r\n     - **主要賣壓：** 11/20 日報整理，這波下跌的主要賣壓是持股的人賣出和融資被強制賣出（見[第一節第 3 點](#2026-11-20-s1-p3)）\r\n     - **借券賣出餘額：** 11/20 的借券賣出餘額與一個月前相比幾乎沒變\r\n     - **一週跌幅：** 前兩波限空令實施期間，台股仍然一週跌 17.5%。\r\n   - **國安基金（[財政部國庫署 11/21 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=722e9b57fd8c44efba51d94b1f7eb6e5)）：**\r\n     - **標題：**「國安基金已進場護盤穩定臺股，請投資人保持信心」\r\n     - **內容：** 依 11/6 臨時委員會議（[財政部 11/06 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=d76cfbf3f67840568607d7bcbe1d7962)）的授權，已進場展開護盤\r\n     - **沒公布的：** 沒有公布買進金額，也沒有公布進場日期\r\n     - **外資：** 財政部說外資等多日賣超台股，賣超「已漸趨收斂」，沒有給數字\r\n   - **行政院專案會議（11/21 上午，卓榮泰主持；[中央廣播電台 14:10](https://tw.news.yahoo.com/%E5%8F%B0%E8%82%A1%E5%8B%95%E7%9B%AA-%E5%8D%93%E6%A6%AE%E6%B3%B0%E5%8F%AC%E9%96%8B%E5%B0%88%E6%A1%88%E6%9C%83%E8%AD%B0-%E8%A6%81%E6%B1%82%E5%BC%B7%E5%8C%96%E5%9C%8B%E5%AE%89%E5%9F%BA%E9%87%91%E7%A9%A9%E5%AE%9A%E5%B8%82%E5%A0%B4%E5%8A%9B%E9%81%93-061052957.html)、[中時 15:50](https://tw.news.yahoo.com/%E5%8F%B0%E8%82%A1%E5%89%B5%E5%8F%B2%E4%B8%8A%E7%AC%AC3%E5%A4%A7%E8%B7%8C%E9%BB%9E-%E5%8D%93%E6%A6%AE%E6%B3%B0%E9%80%A32%E5%A4%A9%E9%96%8B%E6%9C%83-%E5%9C%8B%E5%AE%89%E5%9F%BA%E9%87%91%E6%88%90%E7%84%A6%E9%BB%9E-075039562.html)）：** 發言人轉述四項裁示：\r\n     - **財政部：** 加強企業融資、信用保證與國安基金的支持\r\n     - **金管會：** 提出穩定市場措施\r\n     - **經濟部：** 協助企業\r\n     - **央行：** 密切注意匯率，必要時處置。\r\n\r\n3. **週一（11/23）有已知的強制賣股。**\r\n   - **11/20 追繳：** 證交所數字顯示，11/20 有 6,462 戶借錢買股的人，擔保品不夠，要補的錢共 64.64 億\r\n   - **預計 11/23 強制賣出：** 其中沒補錢的，預計下一個交易日有 632 戶、約 14.95 億會被券商直接賣掉股票\r\n   - **影響：** 強制賣出是賣壓來源之一（詳見 [11/20 日報的 4.1](#2026-11-20-s4-1)）\r\n   - **官方措施：** 這一塊金管會五項措施沒有處理，官方也沒有公告「國安基金規模倍增」（需要立法院修法）\r\n   - **11/22 媒體報導：** 證交所研議把整戶維持率門檻由 130% 降到 120%，尚未公告（見[第三節 3.1](#2026-11-21-s3-1)）。\r\n\r\n4. **輝達 11/20 收 125.53 美元，單日 -14.01%；財報之外還有幾件事沒有解決。**\r\n   - **事實：**\r\n     - **股價：** 11/20 收盤 125.53 美元，單日 -14.01%，從 11/18 的 150.96 美元算起兩天累計約 -17%（[Yahoo Finance](https://finance.yahoo.com/quote/NVDA/history/)）\r\n     - **財報：** 11/17 公布的財報營收 1,158.4 億美元，年增 103%，資料中心營收 1,076 億美元，下一季營收預估 1,300 億美元（±3%）（[輝達新聞稿](https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-third-quarter-fiscal-2027)）。\r\n   - **還沒解決的事：**\r\n     - **執行長位置空著：** 黃仁勳 11/12 辭職，財務長 Kress 暫代（[SEC 公告](https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm)）。\r\n     - **12/1 國會訪談：** 眾議院中國特別委員會公布，黃仁勳 12/1、輝達法務長 12/2 同意接受有逐字記錄的閉門訪談（[眾議院中國特別委員會 11/17 新聞稿](https://chinaselectcommittee.house.gov/media/press-releases/jensen-huang-and-nvidia-agree-to-appear-before-congress)）。\r\n     - **美國證管會（SEC）調查：** 《華爾街日報》11/17 引述知情人士報導，SEC 展開民事調查，部分審查輝達的資訊揭露是否誤導投資人；SEC 與輝達都沒有證實（[InvestmentNews](https://www.investmentnews.com/equities/embattled-nvidia-faces-sec-probe-as-california-attorney-general-mulls-action/269054)、[世界日報](https://www.worldjournal.com/wj/story/121172/9886355)）。\r\n     - **加州檢察長 Bonta** 11/17 在彭博電視說，辦公室在檢視輝達晶片是否轉運到中國，沒有給細節，報導裡也沒有提到傳票（InvestmentNews）。\r\n     - **美國財政部長貝森特**說，需要董事會和外部律師在 10 天內給答案（[InvestmentNews 11/17](https://www.investmentnews.com/equities/embattled-nvidia-faces-sec-probe-as-california-attorney-general-mulls-action/269054)）。\r\n     - **對中國出貨：**\r\n       - **財測：** 輝達財測不含中國資料中心運算營收（[輝達新聞稿](https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-third-quarter-fiscal-2027)）\r\n       - **上一季：** 上一季（到 10/25）Hopper 系列資料中心產品對中國出貨 24 億美元（[輝達 CFO 評論](https://www.sec.gov/Archives/edgar/data/1045810/000104581026000088/q3fy27cfocommentary.htm)）\r\n       - **財報電話會議：** Kress 在 11/17 財報電話會議說，已停止出貨經許可的 Hopper 系列產品（包括 H200）到中國（[TweakTown](https://www.tweaktown.com/news/114771/nvidia-stops-shipping-licensed-hopper-ai-chips-including-h200-to-china/index.html)、[Digital Today](https://www.digitaltoday.co.kr/en/view/127494/nvidia-to-halt-h200-sales-to-china-after-jensen-huang-exit)；輝達官方財報文件沒有這句話）。\r\n\r\n5. **美元兌台幣 32.936，距 33 約 0.2%；央行被要求密切注意匯率。** 11/20 收盤 32.936，前一日 32.942（[期交所每日外幣參考匯率](https://openapi.taifex.com.tw/v1/DailyForeignExchangeRates)）。外資如果大量賣股、把錢匯出去，台幣會貶值。\r\n\r\n## 二、美股與外部環境（11/20 收盤，台北 11/21 早上抓取）\r\n資料來源：[Yahoo Finance](https://finance.yahoo.com/) 日線；美元兌台幣為[期交所每日外幣參考匯率](https://openapi.taifex.com.tw/v1/DailyForeignExchangeRates)。表中變動是 11/19 收盤到 11/20 收盤。\r\n\r\n| 項目 | 11/19 收盤 | 11/20 收盤 | 變動 |\r\n|---|---:|---:|---:|\r\n| 標普 500 | 7,175.83 | 6,910.39 | -3.70% |\r\n| 那斯達克綜合 | 23,879.20 | 22,617.73 | -5.28% |\r\n| 費城半導體 | 9,419.72 | 8,408.59 | -10.73% |\r\n| 美國 VIX | 28.44 | 35.89 | +7.45 點 |\r\n| 輝達 NVDA | 145.98 | 125.53 | -14.01% |\r\n| 台積電 ADR（TSM） | 352.09 | 318.71 | -9.48% |\r\n| iShares 台灣 ETF（EWT） | 83.96 | 74.77 | -10.95% |\r\n| 美元兌台幣 | 32.942 | 32.936 | -0.02% |\r\n\r\n**這些數字怎麼看：**\r\n- **跌的是科技與半導體，但已經擴散到整個美股。** 費半 -10.73% 是最重的；標普 500 比 10/6 的歷史高點低約 11.5%，已進入「修正」（從高點跌 10% 以上）；[Stock Titan](https://www.stocktitan.net/articles/stock-market-today-live-november-20-2026) 寫，道瓊 ETF（DIA）一週跌約 8.0%，是 2020 年 3 月以來最大的單週跌幅。\r\n- **亞洲其他市場也跌，但台灣最重：** 台灣 ETF（EWT）-10.95%、南韓 ETF（EWY）-8.42%、日本 ETF（EWJ）-4.11%。\r\n- **美國 VIX 35.89：** 換算約是市場預期美股接下來一個月平均每天上下震盪約 2.3%（35.89 除以 √252），一天跳升 7.45 點。台灣 VIX 52.20（約 3.3%）與美國 VIX 屬不同市場，數字不能直接比較。\r\n- **Anthropic：**\r\n  - **11/19：** 在那斯達克上市，發行價 83.00 美元，首筆成交 111.50 美元，當天收盤 97.17 美元，比發行價高 17%（這個「+17%」是對發行價，不是當日漲幅）\r\n  - **11/20：** 收盤 88.91 美元，單日 -8.50%，仍比發行價高約 7.1%（[Stock Titan](https://www.stocktitan.net/articles/stock-market-today-live-november-20-2026)、[商業周刊](https://www.businessweekly.com.tw/international/blog/3023617)）。\r\n\r\n## 三、週末新聞與政策進展\r\n### 3.1 護盤措施：金管會五項已公告、國安基金已進場，其餘仍待公告\r\n- **已公告，11/23 週一起適用：** 金管會五項措施，內容見[第一節第 2 點](#2026-11-21-s1-p2)。\r\n- **還沒有公告（[金管會新聞稿列表](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2)最新一則是 11/21）：**\r\n  - **「整戶融資擔保維持率由 130% 降到 120%」：媒體報導研議中，證交所與金管會尚未公告。**\r\n    - **背景：** [聯合報 11/20](https://udn.com/news/story/7251/9891975) 引述知情人士報導，行政院討論的選項包括放寬融資擔保維持率的計算；金管會 11/21 的五項措施沒有包含。\r\n    - **11/22 報導（時間為各報導標示）：**\r\n      - **[TVBS 14:17](https://news.tvbs.com.tw/money/4054347)：** 「市場傳出」證交所緊急通知十大券商開會，討論是否由 130% 降到 120%；寫「證交所尚無回應」。\r\n      - **[經濟日報 15:27](https://money.udn.com/money/story/5607/9894620)：** 證交所 22 日上午邀集 10 家大型券商研商，規畫由 130% 調為 120%；須經金管會確認後，再決定上路時間。\r\n      - **[今日新聞 17:03](https://tw.news.yahoo.com/%E8%AD%89%E4%BA%A4%E6%89%80%E6%89%BE%E5%88%B8%E5%95%86-%E5%96%9D%E5%92%96%E5%95%A1-%E8%AB%87%E9%99%8D%E8%9E%8D%E6%93%94%E7%B6%AD%E6%8C%81%E7%8E%87%E9%99%8D-090312898.html)、[今周刊 17:27](https://www.businesstoday.com.tw/article/category/183008/post/202611220008/)：** 寫「朝降到 120% 的方向取得共識」；今日新聞寫目標 11/23 上路，今周刊寫可望 11/23 上路。\r\n    - **目前能確定與不能確定的：**\r\n      - **官方公告：** 各報導都沒有引用證交所或金管會的正式公告；證交所法規仍以 130% 為追繳門檻。\r\n      - **說法不一致：** 共識程度（「規畫」「取得共識」「討論是否」）、上路時間（今日新聞寫目標 11/23、今周刊寫可望 11/23、TVBS 寫「最快本周」）。\r\n      - **對強制處分的影響：** 報導都沒有估算；上面的 6,462 戶、632 戶是以 130% 計算的 11/20 官方數字。\r\n      - **業界表態：** 券商公會理事長陳俊宏公開表示支持調降，認為可減輕追繳壓力，但券商承擔的授信風險變高（經濟日報）。\r\n  - **「國安基金規模倍增到 1 兆元」：**\r\n    - **進度：** 需立法院修法，目前沒有看到修法進度（[三立 11/20](https://www.setn.com/news/1942451)）\r\n    - **現行規模：** 5,000 億是向金融機構借款最多 2,000 億（以國庫持股擔保）加向四大基金借款最多 3,000 億，實務上只用過金融機構借款的 2,000 億\r\n    - **國安基金報告建議：** 把金融機構借款上限提高到 7,000 億、四大基金借款維持 3,000 億，財政部長莊翠雲表示持正面看法（[自由時報 11/11](https://ec.ltn.com.tw/article/breakingnews/5636788)）。\r\n- **官股買超（八大行庫）：** [中國時報 11/19](https://wantrich.chinatimes.com/news/20261119900297-420101) 報導，八大行庫當日買超 329.84 億元、四日合計約 766.63 億元（官股買賣超沒有官方資料）。\r\n\r\n### 3.2 輝達與 AI 供應鏈\r\n- **事實與調查：** 詳見[第一節第 4 點](#2026-11-21-s1-p4)。\r\n- **後續時程：** 12/1 黃仁勳、12/2 輝達法務長接受眾議院委員會的閉門訪談（[眾議院中國特別委員會 11/17 新聞稿](https://chinaselectcommittee.house.gov/media/press-releases/jensen-huang-and-nvidia-agree-to-appear-before-congress)）。完整事件脈絡請看 [11/20 日報的 8.6](#2026-11-20-s8-6)。\r\n\r\n## 四、台股既有風險\r\n- **強制賣股：** 官方整戶擔保維持率 151.78%，低於 130% 的戶數 6,462 戶，預計 11/23 強制處分 632 戶、14.95 億（11/20 資料）。11/22 有媒體報導證交所研議把門檻由 130% 降到 120%，尚未公告（見[第三節 3.1](#2026-11-21-s3-1)）。（機制見 [11/20 日報 4.1](#2026-11-20-s4-1)。）\r\n- **借錢買股的規模：** 融資餘額 4,352 億，比 11/11 的 5,412 億少約兩成；11/20 單日減少 491 億，是證交所儀表板資料（2026-08-24 起）中最大的單日減少。\r\n- **跌勢擴散程度：** 約一半的上市股票（488 檔）創一年新低；台灣 VIX 52.20，選擇權市場預期接下來一個月加權指數平均每天約震盪 3.3%（11/20 資料）。\r\n- **指數位置：** 加權指數收 36,033.29，比 11/11 的 44,257.15 低 18.6%；11/16 到 11/20 這一週累計 -7,641.83 點（-17.5%），是證交所 2024 年 1 月以來資料中最大的單週跌幅（[證交所](https://www.twse.com.tw/rwd/zh/TAIEX/MI_5MINS_HIST?date=20261101\u0026response=json)）。\r\n\r\n## 五、下一個交易日（11/23 週一）已知事項與觀察\r\n| 觀察項目 | 為什麼看 |\r\n|---|---|\r\n| 週一開盤價與週五收盤價的差距（對照夜盤收 33,919、台積電 ADR -9.48%） | 夜盤收盤比週五收盤低 5.87%，台積電 ADR 11/20 跌 9.48%；對照這兩個數字，看開盤實際跌多少 |\r\n| 全面禁止平盤以下放空生效後，融券與借券賣出是否明顯減少 | 觀察金管會措施有沒有真的壓住空方；證交所每日有融券借券賣出統計 |\r\n| 國安基金實際買進的力道（成交量、權值股走勢） | 官方沒有公布金額，只能從盤面推估 |\r\n| 官方整戶維持率、追繳與處分戶數是否擴大；預計處分是否如期進行 | 看追繳與處分戶數比 11/20 增加還是減少；金管會措施沒有處理這一塊。另看證交所是否正式公告把門檻由 130% 降到 120%（目前只有媒體報導），公告後追繳戶數的計算基準會跟著變 |\r\n| 外資動向：外資現貨由賣轉買、期貨空單回補 | 外資現貨賣超金額與期貨空單部位，是賣壓大小的資料 |\r\n| 成交量 | 比較下跌日與其他日的成交量 |\r\n| 台幣是否貶破 33，以及央行有沒有動作 | 外資賣股匯出會使台幣貶值；行政院裁示央行密切注意匯率 |\r\n| 輝達後續：接班人、12/1 國會訪談、SEC 調查、財政部長要求的 10 天答覆 | 這些是輝達尚未解決的事項，細節見第一節第 4 點 |\r\n\r\n## 六、資料來源與限制\r\n- **官方資料：**\r\n  - **金管會：** [金管會 11/19 新聞稿](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611190001\u0026dtable=News)、[金管會 11/21 新聞稿](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611210001\u0026dtable=News)\r\n  - **財政部：** [財政部 11/06 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=d76cfbf3f67840568607d7bcbe1d7962)、[財政部 11/21 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=722e9b57fd8c44efba51d94b1f7eb6e5)\r\n  - **聯準會：** [聯準會理事庫克 11/20 演講](https://www.federalreserve.gov/newsevents/speech/cook20261120a.htm)\r\n  - **輝達：** [SEC 公告（11/12）](https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm)、[財報新聞稿](https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-third-quarter-fiscal-2027)、[CFO 評論](https://www.sec.gov/Archives/edgar/data/1045810/000104581026000088/q3fy27cfocommentary.htm)\r\n  - **眾議院中國特別委員會：** [眾議院中國特別委員會 11/17 新聞稿](https://chinaselectcommittee.house.gov/media/press-releases/jensen-huang-and-nvidia-agree-to-appear-before-congress)\r\n  - **期交所：** [每日行情開放資料](https://openapi.taifex.com.tw/v1/DailyMarketReportFut)、[行情資訊網站（夜盤即時行情）](https://mis.taifex.com.tw/futures/)、[每日外幣參考匯率](https://openapi.taifex.com.tw/v1/DailyForeignExchangeRates)\r\n  - **證交所：** [證交所臺股儀表板](https://www.twse.com.tw/dashboard/zh/index.html)。\r\n- 限制：所有「最新」數字都是抓取當下的快照。資料由 AI 協助整理，作者已查核。資料來源已列於各項連結；內容為資料彙整與歷史型態解讀，不含對未來走勢的預測，不構成投資建議，無任何金融商品買賣建議，投資人應自行判斷與承擔風險。\r\n"},{"date":"2026-11-20","label":"2026-11-20","kind":"trading","title":"台股大盤日報｜2026-11-20（五）","md":"# 台股大盤日報｜2026-11-20（五）\n\n資料截止：2026-11-20 台股收盤；美股數字為 11/20 美股收盤（台北時間 11/21 早上），見[第七節](#2026-11-20-s7)與 [11/21 非交易日日報第二節](#2026-11-21-s2)。\n\n**閱讀順序：** 一、重點結論 → 二、怎麼解讀，接下來看什麼 → 三到七、支持的數據（每日資料、槓桿籌碼、期貨選擇權情緒、廣度、外部環境）→ 八、新聞與事件 → 九、來源與限制。\n\n## 一、重點結論\n**一句話：** 加權指數 11/16 到 11/20 這一週下跌 7,641.83 點（-17.5%）；整戶維持率低於 130% 的戶數 11/18 到 11/20 從 719 戶增到 6,462 戶，預計 11/23 有 632 戶、約 14.95 億元被券商處分。\n\n1. **11/20 加權指數 -6.23%，收 36,033，比 11/11 的最高點 44,257 低 18.6%。** 上市股票 16 檔上漲、1,058 檔下跌，179 檔跌停；488 檔（約一半）創一年來新低，是近 50 個交易日最多。\n\n2. **融資餘額 11/11 到 11/20 少了約兩成；整戶維持率下降，低於 130% 的戶數增加。**\n   - **融資是什麼：** 向券商借錢買股票，買進的股票押在券商那裡當擔保。\n   - **為什麼會連動（一般機制說明，不是官方對這波的結論）：** 股價跌，擔保品就變少。「擔保品價值 ÷ 借款金額」（整戶擔保維持率）低於 130%，券商會通知補錢；沒補的話，券商會在下一個交易日直接把股票賣掉。這些賣單可能壓低股價，股價下跌又會讓更多帳戶的維持率下降。\n   - **現在走到哪一步：** 整戶維持率從 11/13 的 177.48% 降到 11/20 的 151.78%。被通知補錢的帳戶，11/18 是 719 戶，11/20 是 6,462 戶（兩天變成約 9 倍，要補 64.64 億）。預計 11/23（週一）會有 632 戶、約 14.95 億被強制賣出。融資餘額 11/11 到 11/20 少了約兩成（5,412 億降到 4,352 億），週五單日少 491 億，是證交所儀表板資料（2026-08-24 起）中最大的單日減少（[證交所](https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN_TREND?response=json\u0026days=60\u0026date=20261120)）。\n   - **預計處分占融資餘額的比例：** 預計處分的 14.95 億，約占融資餘額 4,352 億的 0.34%；融資餘額 11/11 到 11/20 減少約 1,060 億。\n\n3. **借券賣出（放空的一種方式）沒有明顯增加。** 放空是借股票來賣、賭股價下跌。借券賣出成交值只占全市場成交值約 1.1% 到 1.9%（11/20 降到 0.27%），借券賣出餘額 11/10 到 11/20 只增加約 0.45%（[證交所](https://www.twse.com.tw/rwd/zh/IIH/market/lending?start=20261105\u0026end=20261120\u0026response=json)）；外資在期貨上的空單也沒有增加（[期交所](https://www.taifex.com.tw/cht/3/futContractsDate)）。\n\n4. **外資賣得變少。** 外資賣超 11/18 到 11/20 依序是 766、243、95 億，一天比一天少（[證交所](https://www.twse.com.tw/rwd/zh/fund/BFI82U?dayDate=20261120\u0026type=day\u0026response=json)）。\n\n5. **台灣 VIX 52.20，是這波下跌以來最高。**\n   - 選擇權可以想成股價的保險：預期波動越大，保險費越貴。台灣 VIX 就是用選擇權價格算出來的「預期波動」指標。\n   - 11/20 是 52.20，大約代表市場預期接下來一個月加權指數平均每天會上下震盪約 3.3%；11/11 的 38.34 則約 2.4%。\n   - **它只說明震盪會多大，不說明會漲還是會跌。**\n\n6. **成交值、自營商避險賣出與美股。** 11/20 成交值 7,225 億，比 11/19 的 7,893 億少。自營商 11/20 賣超約 341 億，其中避險約 290 億。美股 11/20 收盤費半（半導體指數）-10.73%（見[第七節](#2026-11-20-s7)）。\n\n7. **為什麼會跌：已確認的事實，與因果整理。**\n   - **已確認的事實：**\n     - 11/02 到 11/06 加權指數累計跌 5,510 點，11/06 收 39,701，比年內高點 49,968 低 10,267 點（20.55%）；外資累計賣超 5,244 億元，10 月賣超 9,943.16 億元是單月紀錄；國安基金 11/06 14:30 召開臨時委員會議，決定啟動安定市場任務（[財政部 11/06 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=d76cfbf3f67840568607d7bcbe1d7962)）。\n     - 輝達（AI 晶片龍頭）執行長黃仁勳 11/12 辭職（[SEC 公告](https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm)）。輝達股價 11/12 收 166.19 美元，比前一日的 173.73 美元低 4.3%（[Yahoo Finance](https://finance.yahoo.com/quote/NVDA/history/)）。\n     - 美股費半 11/13 跌 3.43%（[Yahoo Finance](https://finance.yahoo.com/quote/%5ESOX/history/)），台股 11/16 跌 6.03%，電子工業類指數跌 6.72%（[證交所](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261116\u0026type=IND\u0026response=json)）。\n     - 輝達 11/17 公布財報：營收 1,158.4 億美元，年增 103%；資料中心營收 1,076 億美元；下一季營收預估 1,300 億美元（±3%）（[輝達新聞稿](https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-third-quarter-fiscal-2027)）。股價之後仍然下跌：11/19 跌 3.3%，11/20 跌 14.01%（Yahoo Finance）。\n     - 市場說法：[經濟日報 11/09](https://money.udn.com/money/amp/story/5607/9865999) 報導，美國期中選舉後有政治人物主張暫停蓋 AI 資料中心，市場擔心 AI 基礎建設放緩。\n   - **因果整理（推論，沒有官方資料指出單一原因）：**\n     1. 經濟日報 11/09 報導，市場對 AI 基礎建設放緩有疑慮（見 [8.2 第 1 點](#2026-11-20-s8-2-p1)）。\n     2. 輝達執行長辭職、對中國出貨有不確定性（見 [8.2 第 2、5 點](#2026-11-20-s8-2-p2)）。輝達與台積電在美國的股票下跌，台股電子股也下跌（11/16 電子工業類指數 -6.72%）。\n     3. 輝達財報營收年增 103%，股價仍然下跌（11/19 -3.3%、11/20 -14.01%），股價下跌不能只用這一季財報解釋。\n     4. 台股自己的資料：融資餘額與整戶維持率見[第四節](#2026-11-20-s4)，自營商避險賣出見 [8.2 第 4 點](#2026-11-20-s8-2-p4)。\n   - **沒有定論的地方：** 輝達辭職後台股第一個交易日（11/13）上漲 1.35%，11/16 才下跌 6.03%。詳細時間線見 [8.6](#2026-11-20-s8-6)。\n## 二、怎麼解讀，接下來看什麼\n**近期出現的指標變化：**\n- 外資賣超一天比一天少。\n- 成交量最後兩天縮小。\n- 融資已經少了約兩成。\n- 台灣 VIX 和創新低家數都升到近期最高。\n\n**需要留意的地方：**\n- **強制賣股的數字還在增加。** 融資的安全墊（整戶維持率）連續下降，一週少了約 25 個百分點，被通知補錢的帳戶一天內從 719 戶變成 6,462 戶，11/23 預計有 632 戶、14.95 億被強制賣出。預計處分的 14.95 億，約占融資餘額 4,352 億的 0.34%；證交所董事長 11/20 也說違約交割和追繳處分「尚未出現明顯異常」（[經濟日報 11/20](https://udn.com/news/story/7251/9892045)）。\n- **美股 11/20 收盤：** 費半 -10.73%，美國 VIX 收 35.89。\n- **台灣 VIX 很高，但 Put/Call 比沒有升高，兩個指標看的東西不同。** VIX 看的是「保險費貴不貴」（預期波動大小）；Put/Call 比看的是買「看跌保險」和「看漲保險」的口數比例。保險費變貴，不一定代表買看跌保險的人變多。\n**接下來要看（每項都說明為什麼看）：**\n1. **美股 11/20 已收盤（費半 -10.73%）：** 台股 11/23 開盤前的外部資料。\n2. **整戶維持率有沒有回升，追繳與處分戶數有沒有減少：** 看戶數與金額比 11/20 增加還是減少；11/23 預計處分 632 戶、14.95 億，看實際處分是否如預計。\n3. **外資有沒有由賣轉買、外資期貨空單有沒有回補：** 外資現貨賣超金額與期貨空單部位，是賣壓大小的資料。\n4. **有沒有出現「爆大量後價格不再創新低」，上漲家數有沒有回到幾百檔、創新低家數有沒有下降：** 看價格、成交量與漲跌家數是否同步變化。\n5. **台幣有沒有貶破 33，同時外資賣超有沒有擴大：** 兩項都是資金流向的資料，一起看。\n6. **政策：放寬融資維持率與擴大國安基金規模尚未公告（見 [8.3](#2026-11-20-s8-3)）：** 前兩波限空令針對放空，不處理強制賣出；放寬融資維持率針對強制賣出，擴大國安基金規模針對政府可用資金。\n7. **輝達事件後續（見 [8.6](#2026-11-20-s8-6) 的追蹤清單）：** 接班人、12/1 國會訪談與對中國出口政策，是輝達尚未解決的事項。\n## 三、每日資料（11/10 到 11/20）\n**表 A：指數、廣度與波動**\n| 日期 | 加權指數 | 漲跌% | 上漲／下跌¹ | 漲停／跌停¹ | 成交值(億)² | 創新低家數³ | 台灣 VIX |\n|---|---|---|---|---|---|---|---|\n| 11/10 | 42,711.92 | +2.52 | 526／491 | 30／2 | 9,322 | 33 | 40.06 |\n| 11/11 | 44,257.15 | +3.62 | 634／368 | 34／3 | 7,912 | 29 | 38.34 |\n| 11/12 | 43,091.87 | -2.63 | 277／730 | 12／10 | 9,592 | 19 | 40.28 |\n| 11/13 | 43,675.12 | +1.35 | 811／199 | 28／3 | 8,560 | 21 | 37.84 |\n| 11/16 | 41,040.08 | -6.03 | 99／948 | 8／83 | 7,495 | 72 | 48.72 |\n| 11/17 | 40,092.11 | -2.31 | 234／789 | 6／30 | 8,673 | 134 | 49.54 |\n| 11/18 | 40,194.91 | +0.26 | 492／520 | 21／4 | 9,585 | 126 | 45.86 |\n| 11/19 | 38,426.89 | -4.40 | 67／993 | 1／128 1/13 | 177.48 | 209 | 0.07 | 27 | 0.17 |\n| 11/16 | 165.98 | 733 | 3.97 | 247 | 5.67 |\n| 11/17 | 161.25 | 1,118 | 6.51 | 207 | 6.88 |\n| 11/18 | 163.16 | 719 | 1.07 | 72 | 2.20 |\n| 11/19 | 156.18 | 2,947 | 29.64 | 520 | 9.18 |\n| 11/20 | **151.78** | **6,462** | **64.64** | **632** | **14.95** |\n\n¹ 儀表板定義：處分戶數與金額是「未依期限補足差額或屆期未清償，次一營業日應由證券商處分信用交易部位」的戶數與金額，也就是下一個交易日預期的強制處分（11/20 的對應日是 11/23，週一），不是當日已發生的賣出。追繳金額是「當日證券商通知應補繳之金額」。11/20 另有 82,967 戶有信用交易（占總開戶數約 0.31%）；券商不限用途款項借貸的維持率為 220.72%。\n\n- **解讀（機制、現在到哪一步、占比）：** 擔保品不夠（維持率低於 130%）的帳戶，會被券商通知補錢；沒補，下一個交易日就被強制賣股，這些賣單可能壓低股價（機制見[第一節第 2 點](#2026-11-20-s1-p2)）。現在走到：低於 130% 的戶數兩天內從 719 戶增到 6,462 戶，追繳金額 11/20 單日 64.64 億，是這段時間最高。占比：追繳金額約占融資餘額 4,352 億的 1.5%、預計處分約 0.34%，11/19 到 11/20，戶數從 2,947 增到 6,462（約 2.2 倍），追繳金額從 29.64 億增到 64.64 億（約 2.2 倍）。130% 是**追繳**線，不是立刻被賣的線。\n### 4.2 借券與當沖\n- **借券賣出（法人放空的主要方式）：** 借券賣出是向別人借股票來賣、賭股價下跌。證交所儀表板的借券賣出成交值，11/10 到 11/19 每天約 112 到 176 億元，占全市場成交值 1.1% 到 1.9%；11/20 降到 25.62 億元（0.27%）（[證交所](https://www.twse.com.tw/rwd/zh/marginTrading/TWIEIU_TREND?response=json\u0026days=12\u0026date=20261120)），因為第二波限空令把盤中借券賣出委託數量上限降到 1%。借券賣出餘額從 11/10 的 18,409,097 張到 11/20 的 18,492,035 張，只增加 82,938 張（約 0.45%）；近 5 日增減：+9,494（11/16）、-55,009、+54,625、+65,637、+11,002（[證交所](https://www.twse.com.tw/rwd/zh/IIH/market/lending?start=20261105\u0026end=20261120\u0026response=json)）。借券賣出成交值占比與餘額的數字，顯示這段期間借券賣出沒有明顯增加。\n- **當沖（當天買進又當天賣出）：** 當沖比是當沖成交股數占總成交股數的比例，大家搶短線時會升高。11/20 是 26.1%（4,460,672 張），比 11/18 的 33.08% 低（[證交所](https://www.twse.com.tw/rwd/zh/dayTrading/TWTB4U?date=20261120\u0026response=json)）。\n### 4.3 三大法人與官股（11/20）\n- 三大法人現貨（[證交所 BFI82U](https://www.twse.com.tw/rwd/zh/fund/BFI82U?dayDate=20261120\u0026type=day\u0026response=json)，億）：外資 -95.1、投信 -73.5、自營商自行買賣 -50.7、自營商避險 -290.2，合計 -509.4。（新聞報導的數字略有不同，見 [8.7](#2026-11-20-s8-7)。）\n- 官股（八大行庫）：[中國時報 11/19](https://wantrich.chinatimes.com/news/20261119900297-420101) 報導八大行庫 11/19 買超 329.84 億元、四日合計約 766.63 億元（官股買賣超沒有官方資料）。\n\n## 五、期貨、選擇權與情緒\n- **外資台指期淨未平倉 -97,863 口（11/20，比前一天少 1,356 口空單；[期交所](https://www.taifex.com.tw/cht/3/futContractsDate)）。** 白話：外資在台指期貨上持有的空單比多單多約 9.8 萬口，近 10 天都在 -96,787 到 -104,271 口之間。空單部位沒有明顯增減。這裡只含臺股期貨 TXF。\n- **投信台指期淨未平倉 +87,599 口。** 投信（國內基金公司）在期貨上持有淨多單約 8.8 萬口，與外資方向相反；目前沒有資料說明原因，這裡只記錄。\n- **台灣 VIX 52.20（11/20，比前一天 +2.93；[期交所](https://www.taifex.com.tw/file/taifex/Dailydownload/vix/log2data/202611new.txt)）。** 台灣 VIX 是用選擇權價格算出來的「預期波動」指標。選擇權是用真錢買保險，預期波動越大，保險費越貴。52.20 大約代表市場預期接下來一個月加權指數平均每天上下震盪約 3.3%。近 8 日：38.34（11/11，約 2.4%）、40.28、37.84、48.72（11/16）、49.54、45.86、49.27、52.20，一週內升約 36%，是這波急殺期間最高。**它只說明震盪會多大，不說明漲跌方向。**\n- **選擇權 Put/Call 比（[期交所](https://openapi.taifex.com.tw/v1/PutCallRatio)晚一天公布，最新為 11/19）。** Put 是看跌選擇權（用來防跌或賭跌），Call 是看漲選擇權；比值是看跌的成交量 ÷ 看漲的成交量。成交量比 73.38%，表示看跌的成交量比看漲少。未平倉比 41.00%，表示還沒了結的看跌部位只有看漲的 41%。近 5 日成交量比 98.66、81.01、78.95、91.97、73.38；未平倉比 57.75、53.79、54.08、39.80、41.00。Put/Call 比沒有升高，與 VIX 上升的方向不同，沒有資料可以確認原因。\n## 六、廣度與創新高低\n- **創新高／創新低家數（用[證交所每日收盤行情](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261120\u0026type=ALLBUT0999\u0026response=json)自行計算）：** 指當天股價創下過去 250 個交易日（約一年）新高或新低的股票數。11/20 創新高 3 檔（0.3%）、創新低 488 檔（47.9%）。**約一半的上市股票創一年來新低。** 這是 2026-09-07 以來（共 50 個交易日）的最高值，前一高是 11/06 的 369 檔（36.3%）。近 9 日創新低家數：19（11/12）、21、72（11/16）、134、126、248、488；創新高家數都在個位數到十幾檔。計算方式：用證交所每日收盤行情自行計算，用盤中高低價對照前 250 個交易日，約 1,018 檔 4 位數一般股票，不含 ETF，未調整除權息。\n- **較長期的漲跌家數對照（上市股票，[證交所大盤統計資訊](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261106\u0026type=MS\u0026response=json)）：**\n\n| 日期 | 漲停 | 上漲 | 跌停 | 下跌 |\n|---|---:|---:|---:|---:|\n| 11/09 | 121 | 804 | 2 | 229 |\n| 11/06 | 4 | 105 | 24 | 952 |\n| 11/05 | 5 | 167 | 56 | 857 |\n| 11/04 | 20 | 438 | 2 | 544 |\n| 11/03 | 2 | 58 | 33 | 1,000 |\n| 11/02 | 10 | 518 | 5 | 447 |\n| 10/30 | 4 | 92 | 11 | 941 |\n\n近一個月有三天下跌家數約 950 到 1,000 家（10/30、11/03、11/06）。\n\n## 七、外部環境\n美股數字為 [Yahoo Finance](https://finance.yahoo.com/) 日線資料；美元兌台幣為[期交所每日外幣參考匯率](https://openapi.taifex.com.tw/v1/DailyForeignExchangeRates)。完整收盤表見 [11/21 非交易日日報第二節](#2026-11-21-s2)。\n- **費 jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611190001\u0026dtable=News)） | 官方追繳戶數 2,947（[證交所](https://www.twse.com.tw/rwd/zh/marginTrading/BFIJ3U_TREND?response=json\u0026days=10\u0026date=20261120)） |\n| 11/20（五） | 加權收 36,033.29，-2,393.60 點（-6.23%），為證交所 2024 年 1 月以來資料中第三大單日跌點；盤中最低 35,738.68。上市股票 179 檔跌停（[證交所](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261120\u0026type=MS\u0026response=json)）。11/16 到 11/20 這一週累計 -7,641.83 點（-17.5%），是同一資料中最大的單週跌幅（用證交所每日指數自行計算） | 融資單日 -491.41 億，兩日合計 -728 億（[證交所](https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date=20261120\u0026selectType=MS\u0026response=json)）；這是證交所儀表板資料（2026-08-24 起）中最大的單日減少（[證交所](https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN_TREND?response=json\u0026days=60\u0026date=20261120)） |\n\n### 8.2 媒體與官方提到的因素\n1. **AI 基礎建設放緩的疑慮。** 事實：[經濟日報 11/09 盤前報導](https://money.udn.com/money/amp/story/5607/9865999)，11/06 的急殺與美國期中選舉後民主黨勢力上升有關，有議員呼籲暫停興建資料中心、德州新當選州長表態暫緩開發案審批，市場擔心全美近四成規劃中的 AI 資料中心可能被暫停審批。費半 11/20 收盤比近一個月高點低約 28%（[Yahoo Finance](https://finance.yahoo.com/quote/%5ESOX/history/)）。\n2. **輝達執行長黃仁勳辭職（因果見 [8.6](#2026-11-20-s8-6)）。** 事實：11/12 輝達董事會宣布他即日辭去總裁、執行長與董事職務，官方未說明原因（[SEC 公告](https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm)）。台股在消息後的第一個交易日（11/13）上漲 1.35%，11/16 下跌 6.03%。\n3. **融資減少與追繳戶數增加。** 事實：融資單日 -491.41 億（降幅 10.15%），兩日合計 -728 億；官方追繳戶數 11/19 為 2,947 戶（追繳 29.64 億，預計處分 520 戶、9.18 億），11/20 增到 6,462 戶（見 [4.1](#2026-11-20-s4-1)）。機制說明見[第一節第 2 點](#2026-11-20-s1-p2)。\n4. **自營商避險賣出。** 事實：11/20 自營商賣超約 341 億，其中避險約 290 億（[證交所](https://www.twse.com.tw/rwd/zh/fund/BFI82U?dayDate=20261120\u0026type=day\u0026response=json)）。避險賣出的一般說明：自營商賣出選擇權或權證給投資人後，會用股票或期貨對沖風險。\n5. **美國對先進晶片的管制與輝達對中國的出貨。** 事實：輝達財測不含中國資料中心運算營收（[輝達新聞稿](https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-third-quarter-fiscal-2027)）；上一季（到 10/25）輝達 Hopper 系列資料中心產品對中國出貨 24 億美元（[輝達 CFO 評論](https://www.sec.gov/Archives/edgar/data/1045810/000104581026000088/q3fy27cfocommentary.htm)）。官方文件沒有的部分，來自媒體：美國商務部 11/16 收緊先進晶片管制（[鉅亨網](https://news.cnyes.com/news/id/6665670)）；輝達代理執行長 Kress 在 11/17 財報電話會議說，已停止出貨經許可的 Hopper 系列產品（包括 H200）到中國（[TweakTown](https://www.tweaktown.com/news/114771/nvidia-stops-shipping-licensed-hopper-ai-chips-including-h200-to-china/index.html)、[Digital Today](https://www.digitaltoday.co.kr/en/view/127494/nvidia-to-halt-h200-sales-to-china-after-jensen-huang-exit)；輝達官方財報文件沒有這句話）。\n6. **美國利率與通膨。** 事實：聯準會理事庫克 [11/20 演講](https://www.federalreserve.gov/newsevents/speech/cook20261120a.htm)說，10 月 PCE 通膨估計年增 3.8%，聯準會 9 月已升息到 3.75% 到 4.00%，她在 10 月維持利率不動時投反對票、主張再升 0.25 個百分點，並說再等下去有落後通膨的風險。台股 11/23 才有對應的交易日。詳見 [11/21 非交易日日報的第一節第 1 點](#2026-11-21-s1-p1)。\n\n### 8.3 政策與護盤動向\n- **國安基金：** 11/06 14:30 臨時委員會議決定啟動安定市場任務（[財政部 11/06 新聞稿](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=d76cfbf3f67840568607d7bcbe1d7962)）。用途：政府設立的穩定基金，市場大跌時可進場買股票，用來穩定股市。\n- **金管會限空令：** 限制融券與借券賣出的價格與數量。\n  - 11/09 第一波：調整盤中借券賣出委託數量及融券保證金成數等措施（[金管會 11/19 新聞稿](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611190001\u0026dtable=News)提到）。\n  - 11/19 公告、11/20 生效的第二波：個股當日收盤跌幅達 3.5% 以上，次一交易日不得以低於前一交易日收盤價融券或借券賣出；盤中借券賣出委託數量上限由前 30 個營業日日均量的 3% 降到 1%；證券商與期貨商因避險等的賣出不受限（[金管會 11/19 新聞稿](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611190001\u0026dtable=News)）。\n- **還沒有公告的研議：**\n  - 「放寬融資擔保維持率的計算」：[聯合報 11/20](https://udn.com/news/story/7251/9891975)引述知情人士報導，行政院討論的選項包括全面禁止下跌股票放空，或放寬融資擔保維持率的計算。\n  - 國安基金規模從 5,000 億倍增至 1 兆元，需修法：增加政府能用來買股的資金（[三立 11/20](https://www.setn.com/news/1942451)）。現行 5,000 億是向金融機構借款最多 2,000 億（以國庫持股擔保）加向四大基金借款最多 3,000 億，實務上只用過金融機構借款的 2,000 億；國安基金報告建議把金融機構借款上限提高到 7,000 億、四大基金借款維持 3,000 億，財政部長莊翠雲表示持正面看法（[自由時報 11/11](https://ec.ltn.com.tw/article/breakingnews/5636788)）。\n- **證交所董事長林修銘（11/20）：** 表示融資餘額 11 月較 10 月高點減少逾 1,500 億元，違約交割及融資追繳處分尚未出現明顯異常，鼓勵公司實施庫藏股（公司買回自家股票，減少市場賣壓）（[經濟日報 11/20](https://udn.com/news/story/7251/9892045)）。\n\n### 8.4 個股與族群（證交所、櫃買中心每日收盤資料）\n- 台積電 11/20 盤中最低 1,970 元，收盤 2,000 元，前一日收 2,100 元，跌 4.76%（[證交所](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261120\u0026type=ALLBUT0999\u0026response=json)）。\n- 0050 收 84.45 元（-6.37%）；反向 ETF 00632R 收 12.52 元（+7.19%），反向 ETF 在指數下跌時獲利，所以逆勢上漲（[證交所](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261120\u0026type=ALLBUT0999\u0026response=json)）。\n- 信驊（5274，上櫃）11/19 收 8,730 元、11/20 收 7,860 元，連兩日跌停（[櫃買中心](https://www.tpex.org.tw/www/zh-tw/afterTrading/tradingStock?code=5274\u0026date=2026/11/20\u0026response=json)）。\n\n### 8.5 官方說法與數字\n- **財政部 11/06 新聞稿（[連結](https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=d76cfbf3f67840568607d7bcbe1d7962)）：** 外資累計賣超 5,244 億元（至 11/06），10 月賣超 9,943.16 億元為單月紀錄。\n- **金管會 11/19 新聞稿（[連結](https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611190001\u0026dtable=News)）：** 上市櫃公司 1 到 10 月營收約 56.75 兆元（+39.05%），前三季稅前盈餘約 6 兆 6,126 億元（+86.43%）；截至 11/18 有 39 家公司實施庫藏股，最高金額約 274.04 億元。\n\n### 8.6 輝達執行長事件：因果鏈與後續追蹤\n官方來源：[SEC 公告](https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm)、[輝達財報新聞稿](https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-third-quarter-fiscal-2027)、[輝達 CFO 評論](https://www.sec.gov/Archives/edgar/data/1045810/000104581026000088/q3fy27cfocommentary.htm)、[眾議院中國特別委員會新聞稿](https://chinaselectcommittee.house.gov/media/press-releases/jensen-huang-and-nvidia-agree-to-appear-before-congress)。媒體另有關於私人行為與涉及中國情報的指控報導，輝達未證實，不引述細節（例如 [CNBC 即時頁面](https://www.cnbc.com/2026/11/12/nvidia-jensen-huang-ceo-live-updates.html)）。\n\n**事件經過**\n| 日期 | 事件 | 來源 |\n|---|---|---|\n| 11/08（日） | 輝達董事會表示信任黃仁勳，並啟動獨立調查；黃仁勳寫信給全體員工道歉 | 媒體：[CNBC](https://www.cnbc.com/2026/11/12/nvidia-jensen-huang-ceo-live-updates.html)、[PC Gamer 時間線](https://www.pcgamer.com/hardware/live/news/nvidia-jen-hsun-scandal/) |\n| **11/12（四 ss)）。\n- 輝達接班人宣布與時程；董事會承諾的進一步說明。\n- 美國對中國晶片出口政策（管制細節、H200 供應）。\n- 台股面：外資與費半、台積電的連動是否持續。\n\n### 8.7 數據差異\n- **三大法人金額：** 證交所 BFI82U（[連結](https://www.twse.com.tw/rwd/zh/fund/BFI82U?dayDate=20261120\u0026type=day\u0026response=json)）11/20 為外資 -95.1、投信 -73.5、自營商 -340.9、合計 -509.4 億；新聞報導（[壹蘋](https://news.nextapple.com/finance/20261120/38901D84CD9518A08BFB3181CE81917F)、[Newtalk](https://tw.news.yahoo.com/%E5%8F%B0%E8%82%A1%E7%88%86%E5%A4%9A%E6%AE%BA%E5%A4%9A-%E5%A4%A7%E7%9B%A4%E7%8B%82%E7%80%892-393%E9%BB%9E-368%E6%AA%94%E8%B7%8C%E5%81%9C-%E5%A4%96%E8%B3%87%E5%83%85%E8%B3%A3%E8%B6%8594%E5%84%84-072753299.html)）寫外資 -94.13、投信 -87.49、自營商 -340.84、合計 -522.46 億。差異（尤其投信）原因不明；本日報採用證交所數字。\n- **漲跌家數：** 新聞用「上市＋櫃買」口徑（上漲 66、下跌 1,896），本日報用上市股票口徑（上漲 16、下跌 1,058），不是同一個基準。\n\n## 九、資料來源與限制\n- **官方資料：**\n  - 證交所：[大盤統計與收盤行情](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261120\u0026type=MS\u0026response=json)、[融資融券](https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date=20261120\u0026selectType=MS\u0026response=json)、[三大法人](https://www.twse.com.tw/rwd/zh/fund/BFI82U?dayDate=20261120\u0026type=day\u0026response=json)、臺股儀表板（[整戶維持率與追繳處分](https://www.twse.com.tw/rwd/zh/marginTrading/BFIJ3U_TREND?response=json\u0026days=10\u0026date=20261120)、[借券賣出餘額](https://www.twse.com.tw/rwd/zh/IIH/market/lending?start=20261105\u0026end=20261120\u0026response=json)、[借券賣出成交值](https://www.twse.com.tw/rwd/zh/marginTrading/TWIEIU_TREND?response=json\u0026days=12\u0026date=20261120)、[融資餘額趨勢](https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN_TREND?response=json\u0026days=60\u0026date=20261120)、[當沖](https://www.twse.com.tw/rwd/zh/dayTrading/TWTB4U?date=20261120\u0026response=json)）、[加權指數日資料](https://www.twse.com.tw/rwd/zh/TAIEX/MI_5MINS_HIST?date=20261101\u0026response=json)、[類股指數](https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261116\u0026type=IND\u0026response=json)；[櫃買中心個股日成交](https://www.tpex.org.tw/www/zh-tw/afterTrading/tradingStock?code=5274\u0026date=2026/11/20\u0026response   function panel(title, sr, kind) {
    var W = 360, H = 150, L = 12, R = 60, T = 18, B = 24, n = sr.vals.length, vals = sr.vals;
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);

    var pad = (mx - mn) * 0.12; mx += pad; if (kind !== 'bar' || mn < 0) mn -= pad;
    function x(i) { return L + (n === 1 ? 0 : i * (W - L - R) / (n - 1)); }
    function y(v) { return T + (mx - v) / (mx - mn) * (H - T - B); }
    var g = '';
    [0, 1, 2].forEach(function (j) { var gy = T + (H - T - B) * j / 2; g += '<line class="ch-grid-l" x1="' + L + '" x2="' + (W - R + 8) + '" y1="' + gy.toFixed(1) + '" y2="' + gy.toFixed(1) + '"/>'; });
    g += '<line class="ch-axis" x1="' + L + '" x2="' + (W - R + 8) + '" y1="' + (H - B + 2) + '" y2="' + (H - B + 2) + '"/>';
    var step = (W - L - R) / Math.max(1, n - 1), bw = Math.min(26, step * 0.62);
    var hi = vals.indexOf(Math.max.apply(null, vals)), lo = vals.indexOf(Math.min.apply(null, vals));
    var mark = {};
    [n - 1, hi, lo, 0].forEach(function (i) {   // priority order; skip a label whose neighbour (within 2 points) is already labelled
      var clash = i !== n - 1 && Object.keys(mark).some(function (k) { return +k !== n - 1 && Math.abs(+k - i) <= 1 && +k !== i; });
      if (!clash) mark[i] = 1;
    });
    if (kind === 'bar') {
      var y0 = y(0);
      g += '<line class="ch-axis" x1="' + L + '" x2="' + (W - R + 8) + '" y1="' + y0.toFixed(1) + '" y2="' + y0.toFixed(1) + '"/>';
      vals.forEach(function (v, i) {
        var yy = y(v), top = Math.min(yy, y0), h = Math.max(1, Math.abs(yy - y0));
        g += '<rect class="' + (v < 0 ? 'ch-neg' : 'ch-pos') + '" x="' + (x(i) - bw / 2).toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="1.5"/>';
      });
      mark = {}; mark[n - 1] = 1; var ab = 0; vals.forEach(function (v, i) { if (Math.abs(v) > Math.abs(vals[ab])) ab = i; }); mark[ab] = 1;
      Object.keys(mark).forEach(function (k) {

  function drawCharts(root) {
    var A = null, Bt = null;

      if (!Bt && d.hs.some(function (h) { return h.indexOf('融資餘額') >= 0; }) && d.hs.some(function (h) { return h.indexOf('官方整戶維持率') >= 0; })) Bt = { t: t, d: d };
    });
    if (!A || !Bt) return;
    var idx = series(A.d, '加權指數'), mg = series(Bt.d, '融資餘額'), kr = series(Bt.d, '官方整戶維持率'),
        ac = series(Bt.d, '低於 130%'), fs = series(Bt.d, '外資現貨'), ff = series(Bt.d, '外資台指期');
    function rng(s) { return s.labels[0] + ' 到 ' + s.labels[s.labels.length - 1]; }
    function pct(s) { var f = s.vals[0], l = s.vals[s.vals.length - 1], p = (l - f) / Math.abs(f) * 100; return (p >= 0 ? '+' : '') + p.toFixed(1) + '%'; }
    function ext(s, big) { var v = big ? Math.max.apply(null, s.vals) : Math.min.apply(null, s.vals); return { v: v, d: s.labels[s.vals.indexOf(v)] }; }
    function sum(s) { return s.vals.reduce(function (a, b) { return a + b; }, 0); }
    var figs = [];
    if (idx && mg) figs.push(['圖 1　指數與融資餘額', '加權指數 ' + rng(idx) + ' ' + pct(idx) + '；融資餘額 ' + pct(mg) + '。', panel('加權指數（點）', idx, 'line') + panel('融資餘額（億元）', mg, 'line')]);
    if (kr && ac) { var kmin = ext(kr, false), amax = ext(ac, true); figs.push(['圖 2　整戶維持率與低於 130% 戶數', '維持率最低 ' + cfmt(kmin.v) + '%（' + kmin.d + '），最新 ' + cfmt(kr.vals[kr.vals.length - 1]) + '%；低於 130% 戶數最多 ' + cfmt(amax.v) + ' 戶（' + amax.d + '），最新 ' + cfmt(ac.vals[ac.vals.length - 1]) + ' 戶。', panel('整戶擔保維持率（%）', kr, 'line') + panel('低於 130% 戶數（戶）', ac, 'bar')]); }
    if (fs && ff) figs.push(['圖 3　外資現貨與期貨', '外資現貨 ' + rng(fs) + ' 合計 ' + cfmt(Math.round(sum(fs) * 10) / 10) + ' 億元；台指期淨未平倉最新 ' + cfmt(ff.vals[ff.vals.length - 1]) + ' 口。', panel('外資現貨買賣超（億元；負值為賣超）', fs, 'bar') + panel('外資台指期淨未平倉（口；負值為淨空單）', ff, 'line')]);

    html += '<p class="ch-note">圖由下方表 A、表 B 的數字畫出，「待補」的日期不畫；數字與來源以表格與各節說明為準。</p>';

  data.forEach(function (r) {
